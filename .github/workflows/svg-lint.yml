name: SVG Lint

on:
  pull_request:
    paths:
      - '_posts/**/*.md'
      - 'assets/images/**/*.svg'
      - 'tools/svg-lint/**'
  push:
    branches: [master]
    paths:
      - '_posts/**/*.md'
      - 'assets/images/**/*.svg'
      - 'tools/svg-lint/**'

jobs:
  svg-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Baseline-ratchet 모드: 기존 부채(baseline.json) 대비 악화·신규 에러만 실패.
      # 개선된 경우 통과. 부채를 줄이면 --update로 baseline을 내려 굳힌다.
      - name: Run svg-lint (ratchet)
        run: node tools/svg-lint/ci-ratchet.mjs

      - name: Upload baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svg-lint-baseline
          path: tools/svg-lint/baseline.json
          retention-days: 7

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" role="img" aria-label="스터디 Q&amp;A 카드. 질문: RDMA 클라이언트는 보통 어떤 언어로 구현하나요? 답: 검증 클라이언트는 Go와 C 하이브리드다. verbs 데이터 경로는 표준 libibverbs만 쓰는 C로 하드웨어 호환을 확보하고, 제어 경로인 HTTP 서명과 흐름제어는 Go로 빠르게 구현했다. 벤더 라이브러리나 mlx5dv, DC transport 의존 없이 표준 동사만으로 구동한다.">
  <title>스터디 Q&amp;A — RDMA 클라이언트 구현 언어</title>
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
  </style>

  <!-- canvas -->
  <rect x="0" y="0" width="760" height="310" fill="#ffffff"/>

  <!-- card frame: x=24 y=24 w=712 h=262, viewBox margins 24 -->
  <rect x="24" y="24" width="712" height="262" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- header label: bbox y 40.5 to 50.5 -->
  <text x="52" y="48" font-size="10" fill="#8b949e">STUDY Q&amp;A</text>

  <!-- question block: y=76 h=68, badge 36x36 at 16px inset -->
  <rect x="52" y="76" width="656" height="68" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <rect x="76" y="92" width="36" height="36" rx="8" fill="#2563eb"/>
  <text x="94" y="114.2" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Q</text>
  <text x="130" y="114.5" font-size="13" font-weight="600" fill="#1f2937">RDMA 클라이언트는 보통 어떤 언어로 구현하나요? (검증 클라이언트 사례)</text>

  <!-- answer block: y=170 h=102, text baselines 197/215/233/251 (pitch 18) -->
  <rect x="52" y="170" width="656" height="102" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <rect x="76" y="175" width="36" height="36" rx="8" fill="#16a34a"/>
  <text x="94" y="197.2" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="130" y="197" font-size="12" fill="#334155">검증 클라이언트는 Go+C 하이브리드</text>
  <text x="130" y="215" font-size="12" fill="#334155">verbs·데이터 경로는 C — 표준 libibverbs만 써 하드웨어 호환 확보</text>
  <text x="130" y="233" font-size="12" fill="#334155">제어 경로(HTTP·서명·흐름제어)는 Go — 빠른 구현</text>
  <text x="130" y="251" font-size="12" fill="#334155">벤더 라이브러리·mlx5dv·DC transport 의존 없음 — 표준 동사만으로 구동</text>
</svg>

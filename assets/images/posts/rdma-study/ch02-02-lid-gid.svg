<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 0 640 415" width="640">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#bc8cff"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
  </style>

  <!-- canvas -->
  <rect x="90" y="0" width="640" height="415" fill="#161b22"/>

  <!-- title: content center x=410 -->
  <text x="410" y="32" font-size="16" fill="#e6edf3" text-anchor="middle">두 개의 주소 공간 — LID와 GID</text>

  <!-- GRH (GID) path: global overlay above the subnet -->
  <path d="M205,145 C 205,75 615,55 615,139" fill="none" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
  <text x="410" y="64" font-size="10" fill="#bc8cff" text-anchor="middle">GRH: DGID = fe80::122:3300:501:8691 (128bit · IPv6 형식)</text>

  <!-- nodes row: y=150 h=76 -->
  <rect x="110" y="150" width="190" height="76" rx="6" fill="#263238" stroke="#546e7a"/>
  <text x="205" y="176" font-size="12" fill="#e6edf3" text-anchor="middle">노드 .40 (HCA)</text>
  <text x="205" y="193" font-size="10" fill="#58a6ff" text-anchor="middle">LID 0x3FA (1018)</text>
  <text x="205" y="208" font-size="10" fill="#bc8cff" text-anchor="middle">GID fe80::122:3300:501:8691</text>

  <rect x="330" y="150" width="160" height="76" rx="6" fill="#37474f" stroke="#8b949e"/>
  <text x="410" y="176" font-size="12" fill="#e6edf3" text-anchor="middle">IB 스위치</text>
  <text x="410" y="193" font-size="10" fill="#8b949e" text-anchor="middle">DLID 기반 포워딩</text>
  <text x="410" y="208" font-size="10" fill="#8b949e" text-anchor="middle">SM 내장(마스터)</text>

  <rect x="520" y="150" width="190" height="76" rx="6" fill="#263238" stroke="#546e7a"/>
  <text x="615" y="176" font-size="12" fill="#e6edf3" text-anchor="middle">노드 .41 (HCA)</text>
  <text x="615" y="193" font-size="10" fill="#58a6ff" text-anchor="middle">LID 0x494 (1172)</text>
  <text x="615" y="208" font-size="10" fill="#bc8cff" text-anchor="middle">GID fe80::/64 (GUID 기반)</text>

  <!-- LRH (LID) path through the switch -->
  <text x="410" y="131" font-size="10" fill="#58a6ff" text-anchor="middle">LRH: DLID = 0x494 — 스위치는 LID만 보고 포워딩</text>
  <path d="M305,188 L319,188" fill="none" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M495,188 L509,188" fill="none" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- comparison row: y=256 h=76 -->
  <rect x="110" y="256" width="280" height="76" rx="6" fill="#263238" stroke="#58a6ff"/>
  <text x="250" y="282" font-size="12" fill="#e6edf3" text-anchor="middle">LID — Local Identifier</text>
  <text x="250" y="299" font-size="10" fill="#8b949e" text-anchor="middle">16bit · SM이 할당 · 서브넷 안에서만 유효</text>
  <text x="250" y="314" font-size="10" fill="#8b949e" text-anchor="middle">IB에서 필수 — DLID=0이면 라우팅 불가</text>

  <rect x="420" y="256" width="280" height="76" rx="6" fill="#263238" stroke="#bc8cff"/>
  <text x="560" y="282" font-size="12" fill="#e6edf3" text-anchor="middle">GID — Global Identifier</text>
  <text x="560" y="299" font-size="10" fill="#8b949e" text-anchor="middle">128bit · IPv6 형식 · GUID에서 파생</text>
  <text x="560" y="314" font-size="10" fill="#8b949e" text-anchor="middle">RoCE는 GID만 사용 — LID 불필요</text>

  <!-- bottom annotations -->
  <text x="110" y="364" font-size="10" fill="#8b949e">이슈⑤ 복선(5편) — IB에서는 DLID=0이면 스위치가 프레임을 라우팅하지 못한다</text>
  <text x="110" y="392" font-size="10" fill="#8b949e">보고서 §9 — 서버의 RoCE 가정 버그: 응답 토큰에 LID 미기재 + AH dlid=0 하드코딩이 IB에서 치명했던 이유</text>
</svg>

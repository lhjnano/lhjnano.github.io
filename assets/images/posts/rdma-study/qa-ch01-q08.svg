<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 3 760 238" width="760" role="img" aria-label="스터디 Q&amp;A 카드: ConnectX-4랑 ConnectX-6은 케이블이 다르게 생기지 않았나요? 겉모습은 거의 동일하지만 전기 규격이 달라 물리적으로 꽂혀도 링크 트레이닝이 실패한다.">
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
  </style>

  <!-- header label: centered on content center x=380 -->
  <text x="380" y="30.5" text-anchor="middle" font-size="10" fill="#8b949e">STUDY Q&amp;A</text>

  <!-- question block: y=50..96 -->
  <rect x="20" y="50" width="720" height="46" rx="8" fill="#eff6ff"/>
  <circle cx="30" cy="73.65" r="9" fill="#2563eb"/>
  <text x="30" y="77.5" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Q</text>
  <text x="43" y="77.5" font-size="13" font-weight="600" fill="#1f2937">ConnectX-4랑 ConnectX-6은 케이블이 다르게 생기지 않았나요?</text>

  <!-- answer block: y=121..221 -->
  <rect x="20" y="121" width="720" height="100" rx="8" fill="#f0fdf4"/>
  <circle cx="30" cy="135.35" r="9" fill="#16a34a"/>
  <text x="30" y="139.2" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">A</text>
  <text x="43" y="139.2" font-size="12" fill="#334155">겉모습은 거의 동일 — QSFP+→28→56은 같은 폼팩터</text>
  <text x="43" y="157.2" font-size="12" fill="#334155">전기적으로 다름 — QSFP28은 4×25G NRZ, QSFP56은 4×50G PAM4</text>
  <text x="43" y="175.2" font-size="12" fill="#334155">물리적으로 꽂히지만 링크 트레이닝 실패</text>
  <text x="43" y="193.2" font-size="12" fill="#334155">외관이 달라지는 건 CX7 OSFP부터</text>
  <text x="43" y="211.2" font-size="12" fill="#334155">구분은 라벨·품번·EEPROM 조회</text>
</svg>

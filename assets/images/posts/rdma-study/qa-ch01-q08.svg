<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 239" width="760" role="img" aria-label="질문: ConnectX-4랑 ConnectX-6은 케이블이 다르게 생기지 않았나요? 답변: 겉모습은 거의 동일하지만 전기 규격이 달라 물리적으로 꽂혀도 링크 트레이닝이 실패한다.">
  <style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}</style>
  <circle cx="30" cy="45.5" r="6.5" fill="#2563eb"/>
  <path d="M20 62.5 C20 53.5, 40 53.5, 40 62.5 Z" fill="#2563eb"/>
  <rect x="75" y="20" width="660" height="56" rx="12" fill="#eff6ff"/>
  <path d="M75 40.0 L62 47.0 L75 54.0 Z" fill="#eff6ff"/>
  <text x="98" y="52.5" font-size="13" font-weight="600" fill="#1f2937">ConnectX-4랑 ConnectX-6은 케이블이 다르게 생기지 않았나요?</text>
  <circle cx="30" cy="110.2" r="2" fill="#16a34a"/>
  <line x1="30" y1="112.2" x2="30" y2="116.2" stroke="#16a34a" stroke-width="1.8"/>
  <path d="M20 116.2 L40 116.2 L40 130.2 L20 130.2 Z" fill="#16a34a"/>
  <circle cx="25" cy="123.2" r="1.9" fill="#dcfce7"/>
  <circle cx="35" cy="123.2" r="1.9" fill="#dcfce7"/>
  <rect x="75" y="102" width="660" height="116" rx="12" fill="#f0fdf4"/>
  <path d="M75 122.0 L62 129.0 L75 136.0 Z" fill="#f0fdf4"/>
  <text x="98" y="128.2" font-size="12" fill="#334155">겉모습은 거의 동일 — QSFP+→28→56은 같은 폼팩터</text>
  <text x="98" y="146.2" font-size="12" fill="#334155">전기적으로 다름 — QSFP28은 4×25G NRZ, QSFP56은 4×50G PAM4</text>
  <text x="98" y="164.2" font-size="12" fill="#334155">물리적으로 꽂히지만 링크 트레이닝 실패</text>
  <text x="98" y="182.2" font-size="12" fill="#334155">외관이 달라지는 건 CX7 OSFP부터</text>
  <text x="98" y="200.2" font-size="12" fill="#334155">구분은 라벨·품번·EEPROM 조회</text>
</svg>

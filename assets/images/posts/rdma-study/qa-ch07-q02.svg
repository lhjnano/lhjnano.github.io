<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 239" width="760" role="img" aria-label="질문: 보통 RDMA S3 클라이언트로 뭘 쓰나요? 답변: 범용 RDMA S3 클라이언트는 사실상 존재하지 않는다.">
  <style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}</style>
  <circle cx="30" cy="45.5" r="6.5" fill="#2563eb"/>
  <path d="M20 62.5 C20 53.5, 40 53.5, 40 62.5 Z" fill="#2563eb"/>
  <rect x="75" y="20" width="660" height="56" rx="12" fill="#eff6ff"/>
  <path d="M75 40.0 L62 47.0 L75 54.0 Z" fill="#eff6ff"/>
  <text x="98" y="52.5" font-size="13" font-weight="600" fill="#1f2937">보통 RDMA S3 클라이언트로 뭘 쓰나요?</text>
  <circle cx="30" cy="110.2" r="2" fill="#16a34a"/>
  <line x1="30" y1="112.2" x2="30" y2="116.2" stroke="#16a34a" stroke-width="1.8"/>
  <path d="M20 116.2 L40 116.2 L40 130.2 L20 130.2 Z" fill="#16a34a"/>
  <circle cx="25" cy="123.2" r="1.9" fill="#dcfce7"/>
  <circle cx="35" cy="123.2" r="1.9" fill="#dcfce7"/>
  <rect x="75" y="102" width="660" height="116" rx="12" fill="#f0fdf4"/>
  <path d="M75 122.0 L62 129.0 L75 136.0 Z" fill="#f0fdf4"/>
  <text x="98" y="128.2" font-size="12" fill="#334155">범용 RDMA S3 클라이언트는 사실상 존재하지 않는다 — S3 생태계는 전부 HTTP</text>
  <text x="98" y="146.2" font-size="12" fill="#334155">실존 조합: NVIDIA cuObject(벤더 라이브러리) · AMD hipObject · AWS FrostByte(내부용)</text>
  <text x="98" y="164.2" font-size="12" fill="#334155">DAOS는 서버 간 데이터플레인만 RDMA — 클라이언트가 쓰는 문은 여전히 HTTP</text>
  <text x="98" y="182.2" font-size="12" fill="#334155">실무 선택지: 표준 SDK(HTTPS) · 벤더 라이브러리 · 자체 구현(표준 verbs RC)</text>
  <text x="98" y="200.2" font-size="12" fill="#334155">아니면 프론트엔드 교체 — NVMe-oF 프론트 + S3 게이트웨이 조합</text>
</svg>

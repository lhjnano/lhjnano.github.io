<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
  </style>

  <!-- canvas -->
  <rect x="0" y="0" width="800" height="550" fill="#161b22"/>

  <!-- title: content center x=400 (columns span 25..775) -->
  <text x="400" y="32" font-size="16" fill="#e6edf3" text-anchor="middle">verbs API — libibverbs 함수군 분류</text>

  <!-- resource group: x=25..255, y=60..477 -->
  <rect x="25" y="60" width="230" height="417" rx="10" fill="none" stroke="#8b949e" stroke-dasharray="6,4"/>
  <text x="37" y="74" font-size="11" fill="#78909c">리소스 생성 — 제어 경로 (ibv_)</text>

  <!-- open_device: y=92..146 -->
  <rect x="45" y="92" width="190" height="54" rx="6" fill="#263238" stroke="#58a6ff"/>
  <text x="57" y="114.3" font-size="12" fill="#e6edf3">ibv_open_device</text>
  <text x="57" y="131.3" font-size="10" fill="#8b949e">디바이스 열기 — uverbsN 경유</text>

  <!-- alloc_pd: y=171..225 -->
  <rect x="45" y="171" width="190" height="54" rx="6" fill="#263238" stroke="#58a6ff"/>
  <text x="57" y="193.3" font-size="12" fill="#e6edf3">ibv_alloc_pd</text>
  <text x="57" y="210.3" font-size="10" fill="#8b949e">보호 도메인(PD) 할당</text>

  <!-- create_cq: y=250..304 -->
  <rect x="45" y="250" width="190" height="54" rx="6" fill="#263238" stroke="#58a6ff"/>
  <text x="57" y="272.3" font-size="12" fill="#e6edf3">ibv_create_cq</text>
  <text x="57" y="289.3" font-size="10" fill="#8b949e">완료 큐(CQ) 생성</text>

  <!-- create_qp: y=329..383 -->
  <rect x="45" y="329" width="190" height="54" rx="6" fill="#263238" stroke="#58a6ff"/>
  <text x="57" y="351.3" font-size="12" fill="#e6edf3">ibv_create_qp</text>
  <text x="57" y="368.3" font-size="10" fill="#8b949e">큐 페어(QP) 생성 — 송·수신 큐</text>

  <!-- reg_mr: y=408..462 -->
  <rect x="45" y="408" width="190" height="54" rx="6" fill="#263238" stroke="#58a6ff"/>
  <text x="57" y="430.3" font-size="12" fill="#e6edf3">ibv_reg_mr</text>
  <text x="57" y="447.3" font-size="10" fill="#8b949e">메모리 등록(MR) — MTT 반영</text>

  <!-- creation-order chain -->
  <path d="M140,151 L140,160" fill="none" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M140,230 L140,239" fill="none" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M140,309 L140,318" fill="none" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M140,388 L140,397" fill="none" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- communication group: x=285..515, y=60..477 -->
  <rect x="285" y="60" width="230" height="417" rx="10" fill="none" stroke="#8b949e" stroke-dasharray="6,4"/>
  <text x="297" y="74" font-size="11" fill="#78909c">통신 — 데이터플레인 (ibv_)</text>

  <!-- post_send: y=92..146 -->
  <rect x="305" y="92" width="190" height="54" rx="6" fill="#263238" stroke="#3fb950"/>
  <text x="317" y="114.3" font-size="12" fill="#e6edf3">ibv_post_send</text>
  <text x="317" y="131.3" font-size="10" fill="#8b949e">송신 WR 게시 — WRITE · READ · Send</text>

  <!-- post_recv: y=171..225 -->
  <rect x="305" y="171" width="190" height="54" rx="6" fill="#263238" stroke="#3fb950"/>
  <text x="317" y="193.3" font-size="12" fill="#e6edf3">ibv_post_recv</text>
  <text x="317" y="210.3" font-size="10" fill="#8b949e">수신 recv 게시 — 완료 대기</text>

  <!-- poll_cq: y=250..304 -->
  <rect x="305" y="250" width="190" height="54" rx="6" fill="#263238" stroke="#3fb950"/>
  <text x="317" y="272.3" font-size="12" fill="#e6edf3">ibv_poll_cq</text>
  <text x="317" y="289.3" font-size="10" fill="#8b949e">완료 큐 폴링 — CQE 회수</text>

  <!-- create_ah: y=329..383 -->
  <rect x="305" y="329" width="190" height="54" rx="6" fill="#263238" stroke="#3fb950"/>
  <text x="317" y="351.3" font-size="12" fill="#e6edf3">ibv_create_ah</text>
  <text x="317" y="368.3" font-size="10" fill="#8b949e">주소 핸들(AH) — GID · LID</text>

  <!-- rdma_cm group: x=545..775, y=60..398 -->
  <rect x="545" y="60" width="230" height="338" rx="10" fill="none" stroke="#8b949e" stroke-dasharray="6,4"/>
  <text x="557" y="74" font-size="11" fill="#78909c">주소·연결 — rdma_cm (rdma_)</text>

  <!-- create_id: y=92..146 -->
  <rect x="565" y="92" width="190" height="54" rx="6" fill="#263238" stroke="#bc8cff"/>
  <text x="577" y="114.3" font-size="12" fill="#e6edf3">rdma_create_id</text>
  <text x="577" y="131.3" font-size="10" fill="#8b949e">통신 식별자 생성</text>

  <!-- resolve_addr: y=171..225 -->
  <rect x="565" y="171" width="190" height="54" rx="6" fill="#263238" stroke="#bc8cff"/>
  <text x="577" y="193.3" font-size="12" fill="#e6edf3">rdma_resolve_addr</text>
  <text x="577" y="210.3" font-size="10" fill="#8b949e">주소 해석 — IP → GID · LID</text>

  <!-- resolve_route: y=250..304 -->
  <rect x="565" y="250" width="190" height="54" rx="6" fill="#263238" stroke="#bc8cff"/>
  <text x="577" y="272.3" font-size="12" fill="#e6edf3">rdma_resolve_route</text>
  <text x="577" y="289.3" font-size="10" fill="#8b949e">경로 확인 — 서브넷 경로</text>

  <!-- connect/accept: y=329..383 -->
  <rect x="565" y="329" width="190" height="54" rx="6" fill="#263238" stroke="#bc8cff"/>
  <text x="577" y="351.3" font-size="12" fill="#e6edf3">rdma_connect · accept</text>
  <text x="577" y="368.3" font-size="10" fill="#8b949e">연결 수립 — RC 세션 시작</text>

  <!-- 5편 preview: x=305..495, y=408..462 -->
  <rect x="305" y="408" width="190" height="54" rx="6" fill="#1976d2" stroke="#58a6ff"/>
  <text x="317" y="430.3" font-size="12" fill="#e6edf3">5편 「verbs 프로그래밍」 예고</text>
  <text x="317" y="447.3" font-size="10" fill="#e3f2fd">생성 순서·상태 전이를 실전 코드로</text>

  <!-- bottom annotations -->
  <text x="25" y="501" font-size="10" fill="#8b949e">이름 규약 — 리소스·통신은 libibverbs(ibv_), 주소·연결은 librdmacm(rdma_) 접두사</text>
  <text x="25" y="527" font-size="10" fill="#3fb950">표준 verbs만 쓰면 MOFED · inbox 어느 스택에서든 동일 동작 — §2 · 보고서 §8</text>
</svg>

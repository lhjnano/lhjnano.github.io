  <!-- vgwrdma process: y=408..462 -->
  <rect x="385" y="408" width="310" height="54" rx="6" fill="#1976d2" stroke="#58a6ff"/>
  <text x="397" y="430.3" font-size="12" fill="#e6edf3">vgwrdma — :7071 · --rdma-rc-enable</text>
  <text x="397" y="447.3" font-size="10" fill="#e3f2fd">rc-v2 RC 데이터플레인 · 표준 verbs (dlopen shim)</text>

  <!-- connectors: host → container (mapping types named in the container-side boxes) -->
  <path d="M320,119 L374,119" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M320,198 L374,198" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M320,277 L374,277" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M320,356 L374,356" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M320,435 L374,435" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- bottom annotations -->
  <text x="25" y="501" font-size="10" fill="#8b949e">이미지 vgwrdma-builder:local (rhel9 + CUDA) — 빌드와 실행을 한 컨테이너에서</text>
  <text x="25" y="527" font-size="10" fill="#58a6ff">실행 — vgwrdma --port :7071 --rdma-rc-enable posix /lustre (보고서 §4)</text>

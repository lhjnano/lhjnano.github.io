  <rect x="45" y="408" width="270" height="54" rx="6" fill="#263238" stroke="#22d3ee"/>
  <text x="57" y="430.3" font-size="12" fill="#e6edf3">호스트 능력 부여</text>
  <text x="57" y="447.3" font-size="10" fill="#8b949e">--net host · memlock=-1 · IPC_LOCK</text>


  <!-- host group: x=25..335, y=60..477 -->
  <rect x="25" y="60" width="310" height="417" rx="10" fill="none" stroke="#8b949e" stroke-dasharray="6,4"/>
  <text x="37" y="74" font-size="11" fill="#78909c">호스트 — 게이트웨이 노드 (.41)</text>


  <text x="57" y="131.3" font-size="10" fill="#8b949e">uverbs0·1 · rdma_cm · umad · issm</text>

  <!-- host /sys: y=171..225 -->
  <rect x="45" y="171" width="270" height="54" rx="6" fill="#263238" stroke="#bc8cff"/>
  <text x="57" y="193.3" font-size="12" fill="#e6edf3">/sys/class/infiniband/</text>
  <text x="57" y="210.3" font-size="10" fill="#8b949e">mlx5_0 · mlx5_1 — verbs 열거의 출처</text>

  <!-- host source tree: y=250..304 -->
  <rect x="45" y="250" width="270" height="54" rx="6" fill="#263238" stroke="#546e7a"/>

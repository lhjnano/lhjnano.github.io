  <text x="397" y="131.3" font-size="10" fill="#8b949e">--device 개별 전달</text>

  <!-- container /sys: y=171..225 -->
  <rect x="385" y="171" width="310" height="54" rx="6" fill="#263238" stroke="#bc8cff"/>
  <text x="397" y="193.3" font-size="12" fill="#e6edf3">/sys — 읽기 전용 마운트</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 3 760 222" width="760" role="img" aria-label="스터디 Q&amp;A 카드: PF가 ConnectX-6인데 VF를 ConnectX-4로 지정할 수 있나요? VF는 PF 칩에서 잘린 분할 자원이라 세대·기능·Device ID를 전부 상속하므로 불가능하다.">
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
  </style>

  <!-- header label: centered on content center x=380 -->
  <text x="380" y="30.5" text-anchor="middle" font-size="10" fill="#8b949e">STUDY Q&amp;A</text>

  <!-- question block: y=50..96 -->
  <rect x="20" y="50" width="720" height="46" rx="8" fill="#eff6ff"/>
  <circle cx="30" cy="73.65" r="9" fill="#2563eb"/>
  <text x="30" y="77.5" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Q</text>
  <text x="43" y="77.5" font-size="13" font-weight="600" fill="#1f2937">PF가 ConnectX-6인데 VF를 ConnectX-4로 지정할 수 있나요?</text>

  <!-- answer block: y=121..205 -->
  <rect x="20" y="121" width="720" height="84" rx="8" fill="#f0fdf4"/>
  <circle cx="30" cy="136.35" r="9" fill="#16a34a"/>
  <text x="30" y="140.2" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">A</text>
  <text x="43" y="140.2" font-size="12" fill="#334155">불가능 — VF는 PF 칩에서 잘린 분할 자원이라 세대·기능·Device ID를 전부 상속</text>
  <text x="43" y="158.2" font-size="12" fill="#334155">mlx5 공통 드라이버도 capability 비트맵으로 세대 구분 — VF에도 노출</text>
  <text x="43" y="176.2" font-size="12" fill="#334155">확인: lspci -nn(15b3=Mellanox), ibv_devinfo</text>
  <text x="43" y="194.2" font-size="12" fill="#334155">VF라서 PF보다 좋아지는 일은 없음 — 관리 권한만 제한</text>
</svg>

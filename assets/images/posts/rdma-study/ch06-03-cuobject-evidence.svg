  <text x="174" y="314" font-size="10" fill="#3fb950" text-anchor="middle">2.096</text>
  <text x="296" y="374" font-size="10" fill="#58a6ff" text-anchor="middle">0.523</text>
  <text x="344" y="255" font-size="10" fill="#3fb950" text-anchor="middle">3.655</text>
  <text x="466" y="374" font-size="10" fill="#58a6ff" text-anchor="middle">0.531</text>
  <text x="514" y="283" font-size="10" fill="#3fb950" text-anchor="middle">2.919</text>
  <text x="636" y="374" font-size="10" fill="#58a6ff" text-anchor="middle">0.538</text>
  <text x="684" y="285" font-size="10" fill="#3fb950" text-anchor="middle">2.860</text>

  <text x="150" y="436" font-size="10" fill="#e6edf3" text-anchor="middle">4 MiB</text>
  <text x="320" y="436" font-size="10" fill="#e6edf3" text-anchor="middle">64 MiB</text>
  <text x="490" y="436" font-size="10" fill="#e6edf3" text-anchor="middle">128 MiB</text>
  <text x="660" y="436" font-size="10" fill="#e6edf3" text-anchor="middle">192 MiB</text>

  <text x="40" y="462" font-size="10" fill="#8b949e">(참조) HTTP(IPoIB MTU 1500): 4 MiB PUT 0.249/GET 1.314 · 64 MiB 0.333/2.225 — RDMA가 전 구간 우위</text>

  <path d="M 400,481 L 400,491" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── panel 3: BAR1 boundary, x=25..775, y=502..657 ── -->
  <rect x="25" y="502" width="750" height="155" rx="10" fill="none" stroke="#8b949e" stroke-dasharray="6,4"/>
  <text x="37" y="520" font-size="11" fill="#78909c">BAR1 경계 — 256 MiB 창에서 잘리는 GPU-direct 전송 (§4.3)</text>

  <text x="40" y="551" font-size="10" fill="#8b949e">GPUDirect RDMA가 BAR1로 GPU 메모리를 매핑 — RTX A6000 BAR1 = 256 MiB (NVML)</text>
  <text x="740" y="551" font-size="10" fill="#bc8cff" text-anchor="end">고객 안내: GPU-direct 전송 크기 ≤ BAR1 여유</text>

  <path d="M40,569 h525 v26 h-525 z" fill="#263238" stroke="#3fb950"/>
  <path d="M565,569 h88 v26 h-88 z" fill="#30363d" stroke="#555555"/>
  <path d="M653,569 h87 v26 h-87 z" fill="#263238" stroke="#f85149"/>

  <text x="302" y="585" font-size="10" fill="#3fb950" text-anchor="middle">0 – 192 MiB</text>
  <text x="609" y="585" font-size="10" fill="#8b949e" text-anchor="middle">192–224</text>
  <text x="696" y="585" font-size="10" fill="#f85149" text-anchor="middle">224–256</text>

  <text x="302" y="618" font-size="10" fill="#3fb950" text-anchor="middle">✓ PUT/GET 성공 · checksum 전 OK</text>
  <text x="740" y="618" font-size="10" fill="#f85149" text-anchor="end">✗ 224 MiB부터 실패 — cuMemObjGetDescriptor rc=1</text>

  <text x="40" y="643" font-size="10" fill="#8b949e">세 게이트웨이(aic1 1.2·2.0, aic2) 동일 실패 — aic 무관 · H100(BAR1 128 GiB) 등은 해당 없음</text>

  <path d="M106,412 v-17 h40 v17 z" fill="#58a6ff"/>
  <path d="M154,412 v-80 h40 v80 z" fill="#3fb950"/>
  <path d="M276,412 v-20 h40 v20 z" fill="#58a6ff"/>

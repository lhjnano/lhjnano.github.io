<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 682" width="800">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#8b949e"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
  </style>

  <!-- canvas: content 25..775, margins 25/25 -->
  <rect x="0" y="0" width="800" height="682" fill="#161b22"/>

  <!-- title: content center x=400 -->
  <text x="400" y="32" font-size="16" fill="#e6edf3" text-anchor="middle">cuObject 실증 종합 — 개통 증거 · GPU-direct 성능 · BAR1 경계</text>

  <!-- ── panel 1: cufile.log evidence, x=25..775, y=56..188 ── -->
  <rect x="25" y="56" width="750" height="132" rx="10" fill="none" stroke="#8b949e" stroke-dasharray="6,4"/>
  <text x="37" y="74" font-size="11" fill="#78909c">개통 증거 — cufile.log 3줄 (클라 gpu-1 · libcufile 1.18.1.6 / libcuobjclient 1.2.0.68)</text>

  <rect x="40" y="94" width="347" height="60" rx="6" fill="#263238" stroke="#22d3ee"/>
  <text x="50" y="112.5" font-size="10" fill="#e3f2fd">nvidia_peermem is enabled</text>
  <text x="50" y="127.5" font-size="10" fill="#8b949e">Device mlx5_0: IB link layer, using default GID index 0</text>
  <text x="50" y="142.5" font-size="10" fill="#8b949e">register with RDMA success mr_size: 67108864</text>

  <rect x="413" y="94" width="347" height="60" rx="6" fill="#263238" stroke="#546e7a"/>
  <text x="423" y="112.5" font-size="10" fill="#e3f2fd">해석 — GPU HBM 64 MiB를 peermem RDMA 등록</text>
  <text x="423" y="127.5" font-size="10" fill="#8b949e">cuFile이 네이티브 IB GID idx0 자동 처리</text>
  <text x="423" y="142.5" font-size="10" fill="#8b949e">게이트웨이 :7071 — DC QP INIT→RTR→RTS 통과</text>

  <path d="M 392,124 L 402,124" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M 400,193 L 400,203" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── panel 2: performance bars, x=25..775, y=214..476 ── -->
  <rect x="25" y="214" width="750" height="262" rx="10" fill="none" stroke="#8b949e" stroke-dasharray="6,4"/>
  <text x="37" y="232" font-size="11" fill="#78909c">GPU-direct 성능 — PUT/GET 처리량 (GB/s)</text>

  <text x="40" y="258" font-size="10" fill="#58a6ff">■ PUT</text>
  <text x="105" y="258" font-size="10" fill="#3fb950">■ GET</text>
  <text x="760" y="258" font-size="10" fill="#8b949e" text-anchor="end">aic1 · libcuobjserver 1.2.0.68 · n=10 · 128/192 MiB은 n=3</text>


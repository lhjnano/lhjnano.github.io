<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 5 760 286" width="760">
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
  </style>

  <!-- canvas -->
  <rect x="0" y="5" width="760" height="286" fill="#ffffff"/>

  <!-- top label -->
  <text x="380" y="32.5" font-size="10" fill="#8b949e" text-anchor="middle">STUDY Q&amp;A</text>

  <!-- question block: x=25, y=56, w=710, h=64 -->
  <g fill="#eff6ff">
    <rect x="25" y="56" width="710" height="64" rx="10"/>
  </g>
  <rect x="45" y="70" width="36" height="36" rx="8" fill="#2563eb"/>
  <text x="63" y="92.2" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Q</text>
  <g fill="#1f2937">
    <text x="101" y="92.5" font-size="13">LNet도 RDMA를 쓰는데 사용법이 다른 건 없을 텐데 — 래퍼라서 그런가요?</text>
  </g>

  <!-- answer block: x=25, y=145, w=710, h=126 -->
  <g fill="#f0fdf4">
    <rect x="25" y="145" width="710" height="126" rx="10"/>
  </g>
  <rect x="45" y="190" width="36" height="36" rx="8" fill="#16a34a"/>
  <text x="63" y="212.2" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <g fill="#334155">
    <text x="101" y="185.2" font-size="12">핵심을 짚은 질문 — "래퍼냐"가 아니라 "RDMA를 소유하는 계층"의 차이</text>
    <text x="101" y="203.2" font-size="12">LNet은 커널(앱 아래)이 RDMA를 소유 → 인터페이스는 VFS/POSIX 그대로, 사용법 변화 0</text>
    <text x="101" y="221.2" font-size="12">사용자공간 RDMA는 MR 등록·QP 생성·CQ 폴링 주체가 필요 → 앱이 링크하는 라이브러리</text>
    <text x="101" y="239.2" font-size="12">같은 클러스터에서 두 계층이 독립적으로 공존할 수 있다</text>
  </g>
</svg>

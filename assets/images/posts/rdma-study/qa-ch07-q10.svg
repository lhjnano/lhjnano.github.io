<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" role="img" aria-label="질문: LNet도 RDMA를 쓰는데 사용법이 다른 건 없을 텐데 래퍼라서 그런가요? 답변: RDMA를 소유하는 계층의 차이다.">
  <style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}</style>
  <circle cx="30" cy="45.5" r="6.5" fill="#2563eb"/>
  <path d="M20 62.5 C20 53.5, 40 53.5, 40 62.5 Z" fill="#2563eb"/>
  <rect x="75" y="20" width="660" height="56" rx="12" fill="#eff6ff"/>
  <path d="M75 40.0 L62 47.0 L75 54.0 Z" fill="#eff6ff"/>
  <text x="98" y="52.5" font-size="13" font-weight="600" fill="#1f2937">LNet도 RDMA를 쓰는데 사용법이 다른 건 없을 텐데, 래퍼라서 그런가요?</text>
  <circle cx="30" cy="110.2" r="2" fill="#16a34a"/>
  <line x1="30" y1="112.2" x2="30" y2="116.2" stroke="#16a34a" stroke-width="1.8"/>
  <path d="M20 116.2 L40 116.2 L40 130.2 L20 130.2 Z" fill="#16a34a"/>
  <circle cx="25" cy="123.2" r="1.9" fill="#dcfce7"/>
  <circle cx="35" cy="123.2" r="1.9" fill="#dcfce7"/>
  <rect x="75" y="102" width="660" height="98" rx="12" fill="#f0fdf4"/>
  <path d="M75 122.0 L62 129.0 L75 136.0 Z" fill="#f0fdf4"/>
  <text x="98" y="128.2" font-size="12" fill="#334155">핵심을 짚은 질문입니다. "래퍼냐"가 아니라 "RDMA를 소유하는 계층"의 차이거든요</text>
  <text x="98" y="146.2" font-size="12" fill="#334155">LNet은 커널(앱 아래)이 RDMA를 소유하므로 인터페이스는 VFS/POSIX 그대로, 사용법 변화가 0입니다</text>
  <text x="98" y="164.2" font-size="12" fill="#334155">사용자공간 RDMA는 MR 등록·QP 생성·CQ 폴링의 주체가 필요해서 앱이 링크하는 라이브러리가 됩니다</text>
  <text x="98" y="182.2" font-size="12" fill="#334155">같은 클러스터에서 두 계층이 독립적으로 공존할 수 있다</text>
</svg>

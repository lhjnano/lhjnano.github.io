<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 426" width="760">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#666666"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
  </style>

  <!-- canvas -->
  <rect x="0" y="0" width="760" height="426" fill="#ffffff"/>

  <!-- title: content center x=380 -->
  <text x="380" y="32" font-size="16" fill="#2c3e50" text-anchor="middle" font-weight="bold">재생 ioctl의 구조와 안전장치</text>

  <!-- top flow: extract, apply, local dataset -->
  <rect x="54" y="64" width="200" height="64" rx="8" fill="#f0f4f8" stroke="#666666" stroke-width="1.5"/>
  <text x="66" y="91" font-size="12" fill="#1f2937" font-weight="bold">원격 노드</text>
  <text x="66" y="109" font-size="11" fill="#495057">ZIL 블록 추출 · extract</text>

  <path d="M259,96 L269,96" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="280" y="64" width="200" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="292" y="91" font-size="12" fill="#2563eb" font-weight="bold">재생 ioctl</text>
  <text x="292" y="109" font-size="11" fill="#495057">원격 ZIL 레코드 적용</text>

  <path d="M485,96 L495,96" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="506" y="64" width="200" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="518" y="91" font-size="12" fill="#1f2937" font-weight="bold">로컬 데이터셋</text>
  <text x="518" y="109" font-size="11" fill="#495057">받은 데이터셋에 반영</text>

  <!-- safety panel -->
  <rect x="25" y="190" width="710" height="112" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="37" y="210" font-size="13" fill="#2c3e50" font-weight="bold">안전장치 4종</text>

  <rect x="42" y="232" width="150" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="117" y="253" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">블록 포인터 거부</text>
  <text x="117" y="271" font-size="11" fill="#495057" text-anchor="middle">데이터 오염 차단</text>

  <rect x="217" y="232" width="150" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="292" y="253" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">로그 장치 변경 거부</text>
  <text x="292" y="271" font-size="11" fill="#495057" text-anchor="middle">구성 고정</text>

  <rect x="392" y="232" width="150" height="52" rx="8" fill="#f0f4f8" stroke="#666666" stroke-width="1.5"/>
  <text x="467" y="253" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">데이터셋별 스위치</text>
  <text x="467" y="271" font-size="11" fill="#495057" text-anchor="middle">zdr:replicate=on</text>

  <rect x="567" y="232" width="150" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="642" y="253" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">암호화 거부</text>
  <text x="642" y="271" font-size="11" fill="#495057" text-anchor="middle">평문 저널만 취급</text>

  <!-- test hooks panel -->
  <rect x="25" y="318" width="710" height="84" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="37" y="334" font-size="13" fill="#2c3e50" font-weight="bold">시험 훅 · 경쟁 조건 통제</text>

  <rect x="42" y="354" width="190" height="36" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="137" y="376.2" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="bold">커밋 지연 주입</text>

  <rect x="258" y="354" width="190" height="36" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="353" y="376.2" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="bold">버려진 itx 카운트</text>
</svg>

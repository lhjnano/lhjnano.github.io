  <rect x="290" y="278" width="210" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="395" y="304" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="bold">fs 복구</text>

  <!-- zfs adapter column -->
  <rect x="525" y="64" width="210" height="48" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="537" y="94" font-size="12" fill="#1f2937" font-weight="bold">vouch zfs</text>
  <rect x="645" y="73" width="70" height="34" rx="8" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- left: vouch engine -->
  <rect x="25" y="64" width="170" height="280" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="37" y="84" font-size="13" fill="#2c3e50" font-weight="bold">vouch 엔진</text>

  <rect x="35" y="104" width="150" height="36" rx="8" fill="#f0f4f8" stroke="#666666" stroke-width="1.5"/>
  <text x="110" y="126" font-size="11" fill="#1f2937" text-anchor="middle">저널 접기 체크포인트</text>

  <rect x="35" y="166" width="150" height="36" rx="8" fill="#f0f4f8" stroke="#666666" stroke-width="1.5"/>
  <text x="110" y="188" font-size="11" fill="#1f2937" text-anchor="middle">C 데몬 2개</text>

  <rect x="35" y="228" width="150" height="36" rx="8" fill="#f0f4f8" stroke="#666666" stroke-width="1.5"/>
  <text x="110" y="250" font-size="11" fill="#1f2937" text-anchor="middle">32B 헤더 · 메시지 10종</text>

  <rect x="35" y="290" width="150" height="36" rx="8" fill="#f0f4f8" stroke="#666666" stroke-width="1.5"/>
  <text x="110" y="312" font-size="11" fill="#1f2937" text-anchor="middle">HMAC 상호 인증</text>

  <!-- engine to adapters -->
  <path d="M200,88 L279,88" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- contract row labels -->
  <text x="242" y="164" font-size="12" fill="#2c3e50" text-anchor="middle" font-weight="bold">채널</text>
  <text x="242" y="234" font-size="12" fill="#2c3e50" text-anchor="middle" font-weight="bold">베이스</text>
  <text x="242" y="304" font-size="12" fill="#2c3e50" text-anchor="middle" font-weight="bold">실체화</text>


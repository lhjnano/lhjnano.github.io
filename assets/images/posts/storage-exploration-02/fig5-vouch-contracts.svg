  <rect x="525" y="278" width="210" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="630" y="304" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="bold">재생 ioctl</text>

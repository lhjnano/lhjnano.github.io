<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="760" role="img">
<style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}</style>
<rect x="0" y="0" width="760" height="268" fill="#ffffff"/>
<text x="380" y="32" font-size="14" fill="#2c3e50" text-anchor="middle" font-weight="700">ZFS 풀의 처리량은 한도의 최솟값에서 멈춘다</text>
<rect x="50" y="70" width="150" height="112" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="125" y="115" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">ARC dirty</text>
<text x="125" y="130" font-size="10" fill="#495057" text-anchor="middle">RAM 약 10%</text>
<text x="125" y="145" font-size="10" fill="#495057" text-anchor="middle">더티 상한</text>
<rect x="228" y="70" width="150" height="112" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="303" y="115" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">txg 주기</text>
<text x="303" y="130" font-size="10" fill="#495057" text-anchor="middle">약 5초</text>
<text x="303" y="145" font-size="10" fill="#495057" text-anchor="middle">커밋 주기</text>
<rect x="406" y="70" width="150" height="112" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="481" y="115" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">vdev 레인</text>
<text x="481" y="130" font-size="10" fill="#495057" text-anchor="middle">구성 시 확정</text>
<text x="481" y="145" font-size="10" fill="#495057" text-anchor="middle">동시 처리 폭</text>
<rect x="584" y="70" width="150" height="112" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="659" y="115" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">디스크 IOPS</text>
<text x="659" y="130" font-size="10" fill="#495057" text-anchor="middle">매체 한도</text>
<text x="659" y="145" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">가장 낮은 한도</text>
<rect x="25" y="208" width="710" height="38" rx="8" fill="#f0f4f8" stroke="#666666" stroke-width="1.5"/>
<text x="380" y="231" font-size="11" fill="#495057" text-anchor="middle">ARC가 넉넉해도 디스크 IOPS가 낮으면 전체는 그 자리에서 멈춘다</text>
</svg>

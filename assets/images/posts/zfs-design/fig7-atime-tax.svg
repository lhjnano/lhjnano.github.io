<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" width="760" role="img">
<style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}</style>
<rect x="0" y="0" width="760" height="286" fill="#ffffff"/>
<text x="380" y="32" font-size="14" fill="#2c3e50" text-anchor="middle" font-weight="700">atime이 켜져 있으면 읽기가 쓰기를 낳는다</text>
<text x="380" y="60" font-size="11" fill="#495057" text-anchor="middle" font-weight="700">파일 읽기 하나의 경로 비교</text>
<rect x="25" y="80" width="340" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="195" y="128" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">atime 켜짐 (기본)</text>
<text x="195" y="143" font-size="10" fill="#495057" text-anchor="middle">파일을 읽는다</text>
<text x="195" y="158" font-size="10" fill="#495057" text-anchor="middle">메타데이터 블록을 새 위치에 다시 쓴다</text>
<rect x="395" y="80" width="340" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="565" y="128" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">atime 꺼짐 (권장)</text>
<text x="565" y="143" font-size="10" fill="#495057" text-anchor="middle">파일을 읽는다</text>
<text x="565" y="158" font-size="10" fill="#495057" text-anchor="middle">여기서 끝난다</text>
<rect x="25" y="226" width="710" height="38" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="380" y="249" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">atime을 실제로 읽는 프로그램이 없다면 off가 거의 공짜인 개선이다</text>
</svg>

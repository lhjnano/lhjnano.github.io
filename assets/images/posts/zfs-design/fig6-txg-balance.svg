<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" width="760" role="img">
<style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}</style>
<rect x="0" y="0" width="760" height="286" fill="#ffffff"/>
<text x="380" y="32" font-size="14" fill="#2c3e50" text-anchor="middle" font-weight="700">txg 주기를 움직이면 양쪽 끝에서 세금이 붙는다</text>
<text x="380" y="60" font-size="11" fill="#495057" text-anchor="middle" font-weight="700">기본값 5초를 기준으로</text>
<rect x="25" y="80" width="340" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="195" y="128" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">주기를 늘리면</text>
<text x="195" y="143" font-size="10" fill="#495057" text-anchor="middle">순차성이 좋아진다</text>
<text x="195" y="158" font-size="10" fill="#495057" text-anchor="middle">크래시 창과 메모리 적체가 늘어난다</text>
<rect x="395" y="80" width="340" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="565" y="128" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">주기를 줄이면</text>
<text x="565" y="143" font-size="10" fill="#495057" text-anchor="middle">지연 첨두가 완화된다</text>
<text x="565" y="158" font-size="10" fill="#495057" text-anchor="middle">IOPS가 올라가고 덩어리가 작아진다</text>
<rect x="25" y="226" width="710" height="38" rx="8" fill="#f0f4f8" stroke="#666666" stroke-width="1.5"/>
<text x="380" y="249" font-size="11" fill="#495057" text-anchor="middle">특별한 이유가 없으면 5초를 그대로 둔다</text>
</svg>

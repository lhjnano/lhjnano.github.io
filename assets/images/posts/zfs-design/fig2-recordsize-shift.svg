<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 368" width="760" role="img">
<style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}</style>
<rect x="0" y="0" width="760" height="368" fill="#ffffff"/>
<text x="380" y="32" font-size="14" fill="#2c3e50" text-anchor="middle" font-weight="700">recordsize 128K에서 1M로: 병목이 이동한다</text>
<rect x="25" y="74" width="710" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="45" y="104" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700">IOPS 벽</text>
<text x="560" y="104" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">높음 → 완화</text>
<rect x="25" y="152" width="710" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="45" y="182" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700">파편화</text>
<text x="560" y="182" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">낮음 → 새 병목</text>
<rect x="25" y="230" width="710" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="45" y="260" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700">순차 대역</text>
<text x="560" y="260" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">부분 활용 → 완전 활용</text>
<rect x="25" y="308" width="710" height="38" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="380" y="331" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">벽은 사라지지 않는다. IOPS에서 파편화로 옮겨졌을 뿐이다</text>
</svg>

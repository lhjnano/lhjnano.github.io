<text x="678" y="275.5" font-size="9.5" fill="#8b949e" text-anchor="middle">스파스 델타 파일 append</text>
<rect x="558" y="322" width="240" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>

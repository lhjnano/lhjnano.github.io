<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 472" width="820" role="img" aria-label="Kopia, Velero, Longhorn 세 도구의 증분 경로가 공유하는 3단 골격 비교. 첫 단계 변경 탐지에서 kopia는 내용 정의 CDC 청킹을 쓰고 velero는 파일시스템 백업과 데이터 무버에서 kopia에 위임하며 longhorn은 CoW 스냅샷 체인의 고정 블록 변경을 본다. 둘째 단계 불변 세그먼트는 kopia는 팩 블롭, velero는 kopia repo와 1회성 JSON tarball, longhorn은 스파스 델타 파일 append로 저장한다. 셋째 단계 색인 체인은 kopia 인덱스, velero BackupRepository CR과 VolumeInfo, longhorn 백업 체인이 맡는다. 세 도구 모두 같은 골격의 변형이며 velero 파일시스템 백업은 kopia 엔진을 그대로 내장한다.">
<style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}</style>
<defs>

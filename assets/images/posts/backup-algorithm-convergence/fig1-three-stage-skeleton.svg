<rect x="22" y="412" width="776" height="38" rx="8" fill="#f0f4f8" stroke="#666666" stroke-width="1.5"/>
<text x="410" y="434.8" font-size="11" fill="#495057" text-anchor="middle">세 도구는 같은 골격의 변형이며, velero 파일시스템 백업(FSB)은 kopia 엔진을 그대로 쓴다</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" width="760">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#666666"/>
    </marker>
    <marker id="arrowFallback" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#fbbf24"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
  </style>

  <!-- canvas -->
  <rect x="0" y="0" width="760" height="364" fill="#ffffff"/>

  <!-- title: content center x=380 -->
  <text x="380" y="32" font-size="16" fill="#2c3e50" text-anchor="middle" font-weight="bold">zchangelog: 커널 관측부터 소비자까지</text>

  <!-- kernel panel with 2-step fallback -->
  <rect x="22" y="124" width="232" height="154" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="34" y="144" font-size="13" fill="#2c3e50" font-weight="bold">커널 · 2단 폴백</text>

  <rect x="34" y="166" width="208" height="36" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="46" y="188.2" font-size="12" fill="#1f2937" font-weight="bold">fanotify · FID</text>
  <text x="230" y="188.2" font-size="12" fill="#495057" text-anchor="end">5.13+</text>

  <path d="M138,207 L138,219" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowFallback)"/>

  <rect x="34" y="230" width="208" height="36" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="46" y="252.2" font-size="12" fill="#1f2937">inotify 폴백</text>
  <text x="230" y="252.2" font-size="12" fill="#495057" text-anchor="end">4.x</text>

  <!-- collector -->
  <rect x="280" y="175" width="200" height="52" rx="8" fill="#f0f4f8" stroke="#666666" stroke-width="1.5"/>
  <text x="380" y="196.2" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">수집기 · store.c</text>
  <text x="380" y="214.2" font-size="12" fill="#495057" text-anchor="middle">SQLite WAL · 배치 커밋</text>

  <!-- consumers panel -->
  <rect x="506" y="124" width="232" height="154" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="518" y="144" font-size="13" fill="#2c3e50" font-weight="bold">소비자</text>

  <rect x="518" y="166" width="208" height="36" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="622" y="188.2" font-size="12" fill="#1f2937" text-anchor="middle">consumers</text>

  <rect x="518" y="230" width="208" height="36" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="622" y="252.2" font-size="12" fill="#1f2937" text-anchor="middle">트림 하한</text>

  <!-- ops box under consumers -->
  <rect x="506" y="306" width="232" height="36" rx="8" fill="#e2e8f0" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="622" y="328.2" font-size="12" fill="#92400e" text-anchor="middle" font-weight="bold">운영 · reconcile · maint</text>

  <!-- flow arrows -->
  <path d="M259,201 L269,201" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M485,201 L495,201" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M622,283 L622,295" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 234" width="560">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#666666"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
  </style>

  <!-- canvas -->
  <rect x="0" y="0" width="560" height="234" fill="#ffffff"/>

  <!-- title: content center x=280 -->
  <text x="280" y="32" font-size="16" fill="#2c3e50" text-anchor="middle" font-weight="bold">측정을 고친 뒤의 진짜 처리량</text>

  <!-- chart frame -->
  <rect x="22" y="70" width="516" height="142" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- before bar -->
  <text x="34" y="104.2" font-size="12" fill="#495057">측정 전</text>
  <rect x="90" y="90" width="172" height="20" rx="3" fill="#999999"/>
  <text x="274" y="103.85" font-size="11" fill="#495057" font-weight="bold">3,100 events/s</text>

  <!-- after bar -->
  <text x="34" y="150.2" font-size="12" fill="#495057">측정 후</text>
  <rect x="90" y="136" width="296" height="20" rx="3" fill="#16a34a"/>
  <text x="398" y="149.85" font-size="11" fill="#1f2937" font-weight="bold">5,500 events/s</text>

  <!-- improvement badge -->
  <text x="499.6" y="150.55" font-size="13" fill="#16a34a" font-weight="bold">+78%</text>

  <!-- note -->
  <text x="34" y="190" font-size="11" fill="#495057">측정 버그 2개를 잡은 뒤의 수치</text>
</svg>

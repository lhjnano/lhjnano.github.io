<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 305" width="760">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#666666"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
  </style>

  <!-- canvas -->
  <rect x="0" y="0" width="760" height="305" fill="#ffffff"/>

  <!-- title: content center x=380 -->
  <text x="380" y="32" font-size="16" fill="#2c3e50" text-anchor="middle" font-weight="bold">검증 장치: 오라클 대조 · 배리어 · 크래시 재생</text>

  <!-- panel 1: oracle diff -->
  <rect x="22" y="62" width="222" height="221" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="34" y="82" font-size="13" fill="#2c3e50" font-weight="bold">① 오라클 대조</text>

  <rect x="34" y="104" width="86" height="36" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="77" y="125.85" font-size="11" fill="#1f2937" text-anchor="middle">질의 결과</text>
  <rect x="146" y="104" width="86" height="36" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="189" y="125.85" font-size="11" fill="#1f2937" text-anchor="middle">전수 스캔</text>

  <path d="M77,145 L77,157" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M189,145 L189,157" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="34" y="168" width="198" height="36" rx="8" fill="#f0f4f8" stroke="#666666" stroke-width="1.5"/>
  <text x="133" y="189.85" font-size="11" fill="#2c3e50" text-anchor="middle">diff 대조</text>

  <path d="M133,209 L133,221" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="34" y="232" width="198" height="36" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="133" y="253.85" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">다르면 폐기</text>

  <!-- panel 2: 16-thread barrier -->
  <rect x="269" y="62" width="222" height="221" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="281" y="82" font-size="13" fill="#2c3e50" font-weight="bold">② 16스레드 배리어</text>

  <rect x="281" y="104" width="86" height="36" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="324" y="125.85" font-size="11" fill="#1f2937" text-anchor="middle">16스레드</text>
  <rect x="393" y="104" width="86" height="36" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="436" y="125.85" font-size="11" fill="#1f2937" text-anchor="middle">동시 태깅</text>

  <path d="M324,145 L324,157" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M436,145 L436,157" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="281" y="168" width="198" height="36" rx="8" fill="#f0f4f8" stroke="#666666" stroke-width="1.5"/>
  <text x="380" y="189.85" font-size="11" fill="#2c3e50" text-anchor="middle">배리어 동기화 150회</text>

  <path d="M380,209 L380,221" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="281" y="232" width="198" height="36" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="380" y="253.85" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="bold">불일치 0 · 패닉 0</text>

  <!-- panel 3: zpool freeze crash replay -->
  <rect x="516" y="62" width="222" height="221" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="528" y="82" font-size="13" fill="#2c3e50" font-weight="bold">③ zpool freeze 크래시</text>

  <rect x="528" y="104" width="86" height="36" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="571" y="125.85" font-size="11" fill="#1f2937" text-anchor="middle">zpool freeze</text>
  <rect x="640" y="104" width="86" height="36" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="683" y="125.85" font-size="11" fill="#1f2937" text-anchor="middle">200건 태깅</text>

  <path d="M571,145 L571,157" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M683,145 L683,157" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="528" y="168" width="198" height="36" rx="8" fill="#f0f4f8" stroke="#666666" stroke-width="1.5"/>
  <text x="627" y="189.85" font-size="11" fill="#2c3e50" text-anchor="middle">export/import · ZIL 재생</text>

  <path d="M627,209 L627,221" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="528" y="232" width="198" height="36" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="627" y="253.85" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="bold">xattr 수 = 색인 수</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" width="760" role="img">
<style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}</style>
<rect x="0" y="0" width="760" height="286" fill="#ffffff"/>
<text x="380" y="32" font-size="14" fill="#2c3e50" text-anchor="middle" font-weight="700">유실을 다루는 두 철학</text>
<rect x="25" y="80" width="340" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="195" y="128" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">다시 보는 쪽</text>
<text x="195" y="143" font-size="10" fill="#495057" text-anchor="middle">전체를 다시 비교한다</text>
<text x="195" y="158" font-size="10" fill="#495057" text-anchor="middle">유실 상태 자체가 없다</text>
<rect x="395" y="80" width="340" height="120" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="565" y="128" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">남겨 두는 쪽</text>
<text x="565" y="143" font-size="10" fill="#495057" text-anchor="middle">세대 계수로 유실을 선언한다</text>
<text x="565" y="158" font-size="10" fill="#495057" text-anchor="middle">선언되면 재스캔으로 돌아간다</text>
<rect x="25" y="226" width="710" height="38" rx="8" fill="#f0f4f8" stroke="#666666" stroke-width="1.5"/>
<text x="380" y="249" font-size="11" fill="#495057" text-anchor="middle">신뢰의 모양은 전수 비교 한 가지가 아니다</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="760" role="img">
<style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}</style>
<rect x="0" y="0" width="760" height="268" fill="#ffffff"/>
<text x="380" y="32" font-size="14" fill="#2c3e50" text-anchor="middle" font-weight="700">변경 탐지의 세 가지 답</text>
<rect x="24" y="70" width="220" height="112" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="134" y="115" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">kopia</text>
<text x="134" y="130" font-size="10" fill="#495057" text-anchor="middle">다시 읽어 비교한다</text>
<text x="134" y="145" font-size="10" fill="#495057" text-anchor="middle">유실 개념이 없다</text>
<rect x="270" y="70" width="220" height="112" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="380" y="115" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">longhorn</text>
<text x="380" y="130" font-size="10" fill="#495057" text-anchor="middle">CoW가 분리해 둔다</text>
<text x="380" y="145" font-size="10" fill="#495057" text-anchor="middle">탐지 비용이 없다</text>
<rect x="516" y="70" width="220" height="112" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="626" y="115" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">changelog PR</text>
<text x="626" y="130" font-size="10" fill="#495057" text-anchor="middle">순간마다 남긴다</text>
<text x="626" y="145" font-size="10" fill="#495057" text-anchor="middle">유실을 선언한다</text>
<rect x="25" y="208" width="710" height="38" rx="8" fill="#f0f4f8" stroke="#666666" stroke-width="1.5"/>
<text x="380" y="231" font-size="11" fill="#495057" text-anchor="middle">세 답은 경쟁이 아니라 각자의 계층에서 자연스러운 선택이다</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 373" width="760">
  <style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}</style>
  <rect x="0" y="0" width="760" height="373" fill="#ffffff"/>
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666666"/>
    </marker>
  </defs>
  <text x="380" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">4개 관측 채널 녹화 파이프라인</text>

  <!-- 관측 트리거 -->
  <rect x="20" y="56" width="140" height="54" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="90" y="78.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">CI 빌드 감시기</text>
  <text x="90" y="96.2" text-anchor="middle" font-size="12" fill="#495057">콘솔 5초 폴링</text>

  <rect x="185" y="56" width="140" height="54" rx="8" fill="#f0f4f8" stroke="#666666"/>
  <text x="255" y="78.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">컨트롤러 기록기</text>
  <text x="255" y="96.2" text-anchor="middle" font-size="12" fill="#495057">4채널 동시 녹화</text>

  <!-- 4채널 2x2 그리드 -->
  <rect x="350" y="56" width="182" height="66" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="441" y="76.35" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">icmp.txt</text>
  <text x="441" y="92.85" text-anchor="middle" font-size="11" fill="#495057">ICMP -v · μs</text>
  <text x="441" y="109.35" text-anchor="middle" font-size="11" fill="#334155">거부의 주체·대상</text>

  <rect x="557" y="56" width="182" height="66" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="648" y="76.35" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">p22.txt</text>
  <text x="648" y="92.85" text-anchor="middle" font-size="11" fill="#495057">포트 트레이스 · μs</text>
  <text x="648" y="109.35" text-anchor="middle" font-size="11" fill="#334155">침묵 구간의 경계</text>

  <rect x="350" y="147" width="182" height="66" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="441" y="167.35" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed">ct.log</text>
  <text x="441" y="183.85" text-anchor="middle" font-size="11" fill="#495057">conntrack 0.5s</text>
  <text x="441" y="200.35" text-anchor="middle" font-size="11" fill="#334155">방향·상태</text>

  <rect x="557" y="147" width="182" height="66" rx="8" fill="#f0f4f8" stroke="#999999"/>
  <text x="648" y="167.35" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">journal.log</text>
  <text x="648" y="183.85" text-anchor="middle" font-size="11" fill="#495057">journalctl · ms</text>
  <text x="648" y="200.35" text-anchor="middle" font-size="11" fill="#334155">이벤트 시각</text>

  <!-- 판독과 확정 -->
  <rect x="350" y="238" width="390" height="54" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="545" y="260.2" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">같은 시간 창에서 정렬·판독</text>
  <text x="545" y="278.2" text-anchor="middle" font-size="12" fill="#495057">저널 ms 타임라인으로 인과 확인</text>

  <rect x="465" y="317" width="160" height="36" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="545" y="339.2" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">원인 확정</text>

  <!-- 연결 화살표 -->
  <path d="M165,83 L174,83" fill="none" stroke="#666666" marker-end="url(#arw)"/>
  <path d="M330,83 L339,83" fill="none" stroke="#666666" marker-end="url(#arw)"/>
  <path d="M441,218 L441,227" fill="none" stroke="#666666" marker-end="url(#arw)"/>
  <path d="M648,218 L648,227" fill="none" stroke="#666666" marker-end="url(#arw)"/>
  <path d="M545,297 L545,306" fill="none" stroke="#666666" marker-end="url(#arw)"/>
</svg>

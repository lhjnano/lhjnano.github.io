<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 408" width="800">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#8b949e"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
  </style>

  <!-- canvas: content 25..775, margins 25/25 -->
  <rect x="0" y="0" width="800" height="408" fill="#161b22"/>

  <!-- title: content center x=400 -->
  <text x="400" y="32" font-size="16" fill="#e6edf3" text-anchor="middle">NVIDIA GPU I/O 생태계 — 세 축과 공통 기반</text>

  <!-- app layer: x=25..775, y=56..108 -->
  <rect x="25" y="56" width="750" height="52" rx="6" fill="#263238" stroke="#546e7a"/>
  <text x="400" y="78" font-size="12" fill="#e6edf3" text-anchor="middle">애플리케이션 — AI 프레임워크 · 스토리지 서비스</text>
  <text x="400" y="94" font-size="10" fill="#8b949e" text-anchor="middle">vLLM · LMCache · NIXL — KV 캐시 오프로드가 스토리지 수요를 부른다</text>

  <!-- app -> three columns -->
  <path d="M141,113 L141,123" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M400,113 L400,123" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M659,113 L659,123" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- three axes: y=134..222, x=25..257 / 284..516 / 543..775 -->
  <rect x="25" y="134" width="232" height="88" rx="6" fill="#263238" stroke="#546e7a"/>
  <text x="37" y="158" font-size="12" fill="#e6edf3">NCCL</text>
  <text x="37" y="174" font-size="10" fill="#e3f2fd">GPU↔GPU — 텐서 병렬화 · AllReduce</text>
  <text x="37" y="189" font-size="10" fill="#8b949e">노드 간 집합통신 — 학습·추론 파이프라인</text>
  <text x="37" y="204" font-size="10" fill="#8b949e">본 가이드 범위 밖</text>

  <rect x="284" y="134" width="232" height="88" rx="6" fill="#263238" stroke="#546e7a"/>
  <text x="296" y="158" font-size="12" fill="#e6edf3">cuFile / GDS</text>
  <text x="296" y="174" font-size="10" fill="#e3f2fd">GPU↔File — 로컬 파일 · 블록스토리지</text>
  <text x="296" y="189" font-size="10" fill="#8b949e">GPUDirect Storage — libcufile 1.18</text>
  <text x="296" y="204" font-size="10" fill="#58a6ff">cuObject의 기반 라이브러리</text>

  <rect x="543" y="134" width="232" height="88" rx="6" fill="#0d47a1" stroke="#3fb950"/>
  <text x="555" y="158" font-size="12" fill="#e6edf3">cuObject</text>
  <text x="555" y="174" font-size="10" fill="#e3f2fd">GPU↔S3 — 원격 오브젝트 스토리지</text>
  <text x="555" y="189" font-size="10" fill="#e3f2fd">GPU HBM 직송 — 호스트 RAM 무경유</text>
  <text x="555" y="204" font-size="10" fill="#3fb950">cuObject가 담당 ✅</text>

  <!-- columns -> common base -->
  <path d="M141,227 L141,237" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M400,227 L400,237" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M659,227 L659,237" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- common base: x=25..775, y=248..304 -->
  <rect x="25" y="248" width="750" height="56" rx="6" fill="#263238" stroke="#22d3ee"/>
  <text x="400" y="272" font-size="12" fill="#e6edf3" text-anchor="middle">GPUDirect RDMA — NIC↔GPU 직접 DMA (BAR1 + peermem)</text>
  <text x="400" y="288" font-size="10" fill="#8b949e" text-anchor="middle">세 축의 공통 기반 — 데이터가 호스트 RAM 버퍼를 거치지 않는다</text>

  <!-- common base -> NIC -->
  <path d="M400,309 L400,319" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- NIC layer: x=25..775, y=330..386 -->
  <rect x="25" y="330" width="750" height="56" rx="6" fill="#263238" stroke="#546e7a"/>
  <text x="400" y="354" font-size="12" fill="#e6edf3" text-anchor="middle">ConnectX NIC (mlx5) — InfiniBand / RoCE / 이더넷</text>
  <text x="400" y="370" font-size="10" fill="#8b949e" text-anchor="middle">ConnectX-6 · 네이티브 IB · 게이트웨이는 inbox OFED</text>
</svg>

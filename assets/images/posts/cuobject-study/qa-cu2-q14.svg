<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 241" width="760" role="img" aria-label="질문: A6000의 256 MiB는 다른 연결이 이미 예약해서 남은 크기 아닌가요? 답변: 태생적 창 크기이지만 직감도 일부 맞다.">
  <style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}</style>
  <circle cx="30" cy="45.5" r="6.5" fill="#2563eb"/>
  <path d="M20 62.5 C20 53.5, 40 53.5, 40 62.5 Z" fill="#2563eb"/>
  <rect x="75" y="20" width="660" height="76" rx="12" fill="#eff6ff"/>
  <path d="M75 40.0 L62 47.0 L75 54.0 Z" fill="#eff6ff"/>
  <text x="98" y="52.5" font-size="13" font-weight="600" fill="#1f2937">A6000의 BAR1 창 크기 얘기가 있는데, 다른 연결에서 이미</text>
  <text x="98" y="72.5" font-size="13" font-weight="600" fill="#1f2937">예약해서 256 MiB만 쓸 수 있었던 건 아니야?</text>
  <circle cx="30" cy="130.2" r="2" fill="#16a34a"/>
  <line x1="30" y1="132.2" x2="30" y2="136.2" stroke="#16a34a" stroke-width="1.8"/>
  <path d="M20 136.2 L40 136.2 L40 150.2 L20 150.2 Z" fill="#16a34a"/>
  <circle cx="25" cy="143.2" r="1.9" fill="#dcfce7"/>
  <circle cx="35" cy="143.2" r="1.9" fill="#dcfce7"/>
  <rect x="75" y="122" width="660" height="98" rx="12" fill="#f0fdf4"/>
  <path d="M75 142.0 L62 149.0 L75 156.0 Z" fill="#f0fdf4"/>
  <text x="98" y="148.2" font-size="12" fill="#334155">256 MiB는 남은 창고가 아니라 GPU가 선언한 태생적 창 크기입니다</text>
  <text x="98" y="166.2" font-size="12" fill="#334155">다만 직감이 맞는 부분도 있어요. 런타임에 Used 몇 MiB가 있고,</text>
  <text x="98" y="184.2" font-size="12" fill="#334155">단일 버퍼 실질 상한은 192 MiB(224 MiB는 등록 거부)입니다</text>
  <text x="98" y="202.2" font-size="12" fill="#334155">동시 등록이면 공용 풀을 나눠 쓰므로 합산이 Free 이하여야 해요. 확인은 Total이 아니라 Free</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 241" width="760" role="img" aria-label="질문: KV 캐시 오프로드는 file과 뭐가 다르길래 다른 방식으로 가져와야 하나요? 답변: 데이터가 어디에 있느냐가 다르고 경로가 갈린다.">
  <style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}</style>
  <circle cx="30" cy="45.5" r="6.5" fill="#2563eb"/>
  <path d="M20 62.5 C20 53.5, 40 53.5, 40 62.5 Z" fill="#2563eb"/>
  <rect x="75" y="20" width="660" height="76" rx="12" fill="#eff6ff"/>
  <path d="M75 40.0 L62 47.0 L75 54.0 Z" fill="#eff6ff"/>
  <text x="98" y="52.5" font-size="13" font-weight="600" fill="#1f2937">cuFile이든 cuObject든 아무든 파일을 보겠다는 거 아닌가요?</text>
  <text x="98" y="72.5" font-size="13" font-weight="600" fill="#1f2937">KV 캐시 오프로드는 file과 뭐가 다르길래 다른 방식으로 가지고 와야 하나요?</text>
  <circle cx="30" cy="130.2" r="2" fill="#16a34a"/>
  <line x1="30" y1="132.2" x2="30" y2="136.2" stroke="#16a34a" stroke-width="1.8"/>
  <path d="M20 136.2 L40 136.2 L40 150.2 L20 150.2 Z" fill="#16a34a"/>
  <circle cx="25" cy="143.2" r="1.9" fill="#dcfce7"/>
  <circle cx="35" cy="143.2" r="1.9" fill="#dcfce7"/>
  <rect x="75" y="122" width="660" height="98" rx="12" fill="#f0fdf4"/>
  <path d="M75 142.0 L62 149.0 L75 156.0 Z" fill="#f0fdf4"/>
  <text x="98" y="148.2" font-size="12" fill="#334155">둘 다 GPU로 데이터를 가져온다는 점은 같지만 데이터 위치가 다릅니다</text>
  <text x="98" y="166.2" font-size="12" fill="#334155">cuFile은 로컬 파일(POSIX 경로), cuObject는 원격 S3(버킷/키)예요</text>
  <text x="98" y="184.2" font-size="12" fill="#334155">KV 캐시는 파일이 아니라 런타임에 HBM에서 태어나는 데이터입니다</text>
  <text x="98" y="202.2" font-size="12" fill="#334155">관계는 대체가 아니라 재사용. cuFile이 GPU 버퍼를 MR 등록하면 cuObject가 그 좌표를 주고받죠</text>
</svg>

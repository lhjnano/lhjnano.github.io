<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3fb950"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
  </style>

  <!-- canvas: content 25..775, margins 25/25 -->
  <rect x="0" y="0" width="800" height="490" fill="#161b22"/>

  <!-- title: content center x=400 -->
  <text x="400" y="32" font-size="16" fill="#e6edf3" text-anchor="middle">BAR1 크기가 곧 전송 크기 한계 (2차 보고서 §4.3)</text>

  <!-- ── left panel: GPU memory map, x=25..387, y=60..296 ── -->
  <rect x="25" y="60" width="362" height="236" rx="10" fill="none" stroke="#8b949e" stroke-dasharray="6,4"/>
  <text x="37" y="78" font-size="11" fill="#78909c">GPU 메모리 맵 — RTX A6000 · HBM 48 GiB</text>

  <text x="40" y="108" font-size="10" fill="#3fb950">■ BAR1 창 256 MiB</text>
  <text x="160" y="108" font-size="10" fill="#8b949e">■ 나머지 ≈47.75 GiB — CPU 전용</text>

  <!-- HBM bar as paths: BAR1 window 40..92 / rest 92..372, y=128..172 -->
  <path d="M40,128 h52 v44 h-52 z" fill="#3fb950"/>
  <path d="M92,128 h280 v44 h-280 z" fill="#37474f"/>
  <text x="232" y="153.5" font-size="10" fill="#e6edf3" text-anchor="middle">나머지 ≈47.75 GiB — CPU 전용</text>

  <!-- NIC reaches only the BAR1 window / CPU reaches the rest -->
  <path d="M66,200 L 66,183" fill="none" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="84" y="200" font-size="10" fill="#3fb950">ConnectX-6 NIC</text>
  <path d="M295,200 L 295,183" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="313" y="200" font-size="10" fill="#8b949e">CPU (호스트)</text>

  <text x="40" y="226" font-size="10" fill="#8b949e">GPUDirect RDMA — NIC이 BAR1 창을 통해 HBM 매핑</text>
  <text x="40" y="252" font-size="10" fill="#f85149">✗ NIC은 BAR1 창 밖 HBM에 직접 RDMA 등록 불가</text>
  <text x="40" y="278" font-size="10" fill="#8b949e">cuFile — register with RDMA success · mr_size 64 MiB</text>

  <!-- ── right panel: measured boundary, x=413..775, y=60..296 ── -->
  <rect x="413" y="60" width="362" height="236" rx="10" fill="none" stroke="#8b949e" stroke-dasharray="6,4"/>
  <text x="425" y="78" font-size="11" fill="#78909c">전송 크기 경계 (GPU-direct)</text>

  <text x="428" y="108" font-size="10" fill="#3fb950">✅</text>
  <text x="452" y="108" font-size="12" fill="#e6edf3">64 MiB</text>
  <text x="522" y="108" font-size="10" fill="#8b949e">등록 성공</text>

  <text x="428" y="136" font-size="10" fill="#3fb950">✅</text>
  <text x="452" y="136" font-size="12" fill="#e6edf3">192 MiB</text>
  <text x="522" y="136" font-size="10" fill="#8b949e">통과 — 딱 BAR1 한계</text>

  <text x="428" y="164" font-size="10" fill="#f85149">✗</text>
  <text x="452" y="164" font-size="12" fill="#e6edf3">224 MiB</text>
  <text x="522" y="164" font-size="10" fill="#8b949e">실패 — BAR1 초과</text>

  <text x="428" y="192" font-size="10" fill="#f85149">✗</text>
  <text x="452" y="192" font-size="12" fill="#e6edf3">256 MiB</text>
  <text x="522" y="192" font-size="10" fill="#8b949e">cuMemObjGetDescriptor rc=1</text>

  <text x="425" y="222" font-size="10" fill="#bc8cff">"BAR 1 size detected via NVML API: 256 MiB" — cufile 로그</text>

  <rect x="428" y="248" width="154" height="30" fill="#3fb950"/>
  <text x="505" y="266.5" font-size="10" fill="#161b22" text-anchor="middle">성공 ≤ 192 MiB</text>
  <rect x="607" y="248" width="153" height="30" fill="#f85149"/>
  <text x="683.5" y="266.5" font-size="10" fill="#161b22" text-anchor="middle">실패 ≥ 224 MiB</text>

  <!-- ── bottom band: BAR1 by GPU, x=25..775, y=321..465 ── -->
  <rect x="25" y="321" width="750" height="144" rx="10" fill="none" stroke="#8b949e" stroke-dasharray="6,4"/>
  <text x="37" y="342" font-size="11" fill="#78909c">GPU별 BAR1 비교 — 데이터센터급은 사실상 무제한</text>

  <rect x="40" y="360" width="160" height="62" rx="6" fill="#263238" stroke="#f85149"/>
  <text x="120" y="379.5" font-size="10" fill="#e6edf3" text-anchor="middle">RTX A6000</text>
  <text x="120" y="394.5" font-size="10" fill="#f85149" text-anchor="middle">256 MiB</text>
  <text x="120" y="409.5" font-size="10" fill="#8b949e" text-anchor="middle">BAR1 한계 도달</text>

  <rect x="226" y="360" width="160" height="62" rx="6" fill="#263238" stroke="#3fb950"/>
  <text x="306" y="379.5" font-size="10" fill="#e6edf3" text-anchor="middle">A100</text>
  <text x="306" y="394.5" font-size="10" fill="#3fb950" text-anchor="middle">128 GiB</text>
  <text x="306" y="409.5" font-size="10" fill="#8b949e" text-anchor="middle">사실상 무제한</text>

  <rect x="412" y="360" width="160" height="62" rx="6" fill="#263238" stroke="#3fb950"/>
  <text x="492" y="379.5" font-size="10" fill="#e6edf3" text-anchor="middle">H100</text>
  <text x="492" y="394.5" font-size="10" fill="#3fb950" text-anchor="middle">128 GiB</text>
  <text x="492" y="409.5" font-size="10" fill="#8b949e" text-anchor="middle">사실상 무제한</text>

  <rect x="598" y="360" width="160" height="62" rx="6" fill="#263238" stroke="#3fb950"/>
  <text x="678" y="379.5" font-size="10" fill="#e6edf3" text-anchor="middle">H200</text>
  <text x="678" y="394.5" font-size="10" fill="#3fb950" text-anchor="middle">128 GiB</text>
  <text x="678" y="409.5" font-size="10" fill="#8b949e" text-anchor="middle">사실상 무제한</text>

  <text x="400" y="448" font-size="10" fill="#e3f2fd" text-anchor="middle">고객 안내 — GPU-direct 전송 크기 ≤ BAR1 여유</text>
</svg>

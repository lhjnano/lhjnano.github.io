<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 241" width="760" role="img" aria-label="질문: S3의 메모리와 RDMA로 통신하는 건가요? 영구 저장은 어떻게 되나요? 답변: 게이트웨이 RAM은 환적 버퍼일 뿐이다.">
  <style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}</style>
  <circle cx="30" cy="45.5" r="6.5" fill="#2563eb"/>
  <path d="M20 62.5 C20 53.5, 40 53.5, 40 62.5 Z" fill="#2563eb"/>
  <rect x="75" y="20" width="660" height="76" rx="12" fill="#eff6ff"/>
  <path d="M75 40.0 L62 47.0 L75 54.0 Z" fill="#eff6ff"/>
  <text x="98" y="52.5" font-size="13" font-weight="600" fill="#1f2937">GPU 안에 있는 VRAM과 S3의 메모리 RDMA 주소로 통신하는 걸 알았는데,</text>
  <text x="98" y="72.5" font-size="13" font-weight="600" fill="#1f2937">그러면 영구 저장을 위해서 저장장치에 저장하겠네요?</text>
  <circle cx="30" cy="130.2" r="2" fill="#16a34a"/>
  <line x1="30" y1="132.2" x2="30" y2="136.2" stroke="#16a34a" stroke-width="1.8"/>
  <path d="M20 136.2 L40 136.2 L40 150.2 L20 150.2 Z" fill="#16a34a"/>
  <circle cx="25" cy="143.2" r="1.9" fill="#dcfce7"/>
  <circle cx="35" cy="143.2" r="1.9" fill="#dcfce7"/>
  <rect x="75" y="122" width="660" height="98" rx="12" fill="#f0fdf4"/>
  <path d="M75 142.0 L62 149.0 L75 156.0 Z" fill="#f0fdf4"/>
  <text x="98" y="148.2" font-size="12" fill="#334155">정확합니다. 다만 그 메모리는 최종 목적지가 아니라 환적(staging) 버퍼예요</text>
  <text x="98" y="166.2" font-size="12" fill="#334155">PUT: GPU HBM ─RDMA→ 게이트웨이 staging MR ─posix I/O→ Lustre/디스크</text>
  <text x="98" y="184.2" font-size="12" fill="#334155">네트워크 구간만 RDMA가 담당하고 영구 저장은 게이트웨이 뒤 디스크에 posix I/O로 기록됩니다</text>
  <text x="98" y="202.2" font-size="12" fill="#334155">S3는 프로토콜이지 메모리가 아니에요. 게이트웨이 프로세스와 백엔드가 있을 뿐이죠</text>
</svg>

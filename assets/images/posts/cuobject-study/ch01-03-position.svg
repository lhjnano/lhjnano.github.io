<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 417" width="700">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#8b949e"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
  </style>

  <!-- canvas: content 25..675, margins 25/25 -->
  <rect x="0" y="0" width="700" height="417" fill="#161b22"/>

  <!-- title: content center x=350 -->
  <text x="350" y="32" font-size="16" fill="#e6edf3" text-anchor="middle">cuObject의 위치와 NIC 요건</text>

  <!-- ── left panel: proven on CX6, x=25..337, y=56..315 ── -->
  <rect x="25" y="56" width="312" height="259" rx="10" fill="none" stroke="#8b949e" stroke-dasharray="6,4"/>
  <text x="37" y="74" font-size="11" fill="#3fb950">ConnectX-6 네이티브 IB에서 동작</text>

  <rect x="40" y="94" width="282" height="52" rx="6" fill="#263238" stroke="#3fb950"/>
  <text x="181" y="116" font-size="12" fill="#e6edf3" text-anchor="middle">GPU HBM 직송</text>
  <text x="181" y="132" font-size="10" fill="#8b949e" text-anchor="middle">peermem MR 등록 — 호스트 RAM 무경유</text>

  <rect x="40" y="171" width="282" height="52" rx="6" fill="#263238" stroke="#3fb950"/>
  <text x="181" y="193" font-size="12" fill="#e6edf3" text-anchor="middle">4~192 MiB 전 구간 통과</text>
  <text x="181" y="209" font-size="10" fill="#8b949e" text-anchor="middle">전 구간 체크섬 일치</text>

  <rect x="40" y="248" width="282" height="52" rx="6" fill="#263238" stroke="#3fb950"/>
    
  <!-- ── right panel: 구형 NIC constraints, x=363..675, y=56..315 ── -->
  <rect x="363" y="56" width="312" height="259" rx="10" fill="none" stroke="#8b949e" stroke-dasharray="6,4"/>
  <text x="375" y="74" font-size="11" fill="#f85149">NIC 요건 — ConnectX-5 이상</text>

  <rect x="378" y="94" width="282" height="52" rx="6" fill="#263238" stroke="#f85149"/>
  <text x="519" y="116" font-size="12" fill="#e6edf3" text-anchor="middle">NIC 요건 — ConnectX-5 이상</text>
  <text x="519" y="132" font-size="10" fill="#8b949e" text-anchor="middle">DC transport 연결 수립에 실패</text>

  <rect x="378" y="171" width="282" height="52" rx="6" fill="#263238" stroke="#f85149"/>
  <text x="519" y="193" font-size="12" fill="#e6edf3" text-anchor="middle">가상화 제약 — SR-IOV VF</text>
  <text x="519" y="209" font-size="10" fill="#8b949e" text-anchor="middle">대형 전송 간헐 실패 (환경 의존)</text>

  <rect x="378" y="248" width="282" height="52" rx="6" fill="#263238" stroke="#f85149"/>
  <text x="519" y="270" font-size="12" fill="#e6edf3" text-anchor="middle">CX6 네이티브에서 재현 불능</text>
  <text x="519" y="286" font-size="10" fill="#8b949e" text-anchor="middle">제약은 IB가 아니라 NIC(VF·세대)에 있음</text>

  <!-- ── bottom band: x=25..675, y=340..392 ── -->
  <rect x="25" y="340" width="650" height="52" rx="6" fill="#263238" stroke="#58a6ff"/>
  <text x="350" y="362" font-size="12" fill="#e6edf3" text-anchor="middle">결론 — "cuObject는 IB에서 불가"가 아니라</text>
  <text x="350" y="378" font-size="10" fill="#8b949e" text-anchor="middle">ConnectX-5 이상에서 정상 동작" (v3 서사 갱신)</text>
</svg>

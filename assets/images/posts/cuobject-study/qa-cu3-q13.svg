<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 241" width="760" role="img" aria-label="질문: 다른 GPU들도 DC 지원 NIC를 쓰면 DC 사용이 가능한가요? 필요 없는 환경도 있나요?">
  <style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}</style>
  <circle cx="30" cy="45.5" r="6.5" fill="#2563eb"/>
  <path d="M20 62.5 C20 53.5, 40 53.5, 40 62.5 Z" fill="#2563eb"/>
  <rect x="75" y="20" width="660" height="76" rx="12" fill="#eff6ff"/>
  <path d="M75 40.0 L62 47.0 L75 54.0 Z" fill="#eff6ff"/>
  <text x="98" y="52.5" font-size="13" font-weight="600" fill="#1f2937">NVIDIA가 DC를 쓰는데, 다른 GPU들은 DC가 지원되는 NIC를</text>
  <text x="98" y="72.5" font-size="13" font-weight="600" fill="#1f2937">사용한다면 DC 사용이 가능한가요? 아예 필요 없는 환경도 있냐요?</text>
  <circle cx="30" cy="130.2" r="2" fill="#16a34a"/>
  <line x1="30" y1="132.2" x2="30" y2="136.2" stroke="#16a34a" stroke-width="1.8"/>
  <path d="M20 136.2 L40 136.2 L40 150.2 L20 150.2 Z" fill="#16a34a"/>
  <circle cx="25" cy="143.2" r="1.9" fill="#dcfce7"/>
  <circle cx="35" cy="143.2" r="1.9" fill="#dcfce7"/>
  <rect x="75" y="122" width="660" height="98" rx="12" fill="#f0fdf4"/>
  <path d="M75 142.0 L62 149.0 L75 156.0 Z" fill="#f0fdf4"/>
  <text x="98" y="148.2" font-size="12" fill="#334155">가능합니다. DCT는 NIC 사이의 전송 방식이라 GPU 벤더와 무관해요</text>
  <text x="98" y="166.2" font-size="12" fill="#334155">단 소프트웨어 스택이 DC를 구현해야 해요. UCX(dc_mlx5)가 dma-buf 등록 GPU 메모리를 DC로 실어줍니다</text>
  <text x="98" y="184.2" font-size="12" fill="#334155">DC가 필요 없는 환경도 많아요. 노드 수십 개 이하면 RC로 충분하고,</text>
  <text x="98" y="202.2" font-size="12" fill="#334155">비-IB 패브릭(EFA·Slingshot)이나 인트라노드(NVLink/xGMI)는 애초에 선택지에 없습니다</text>
</svg>

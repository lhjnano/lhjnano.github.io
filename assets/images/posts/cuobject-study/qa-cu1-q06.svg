<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 241" width="760" role="img" aria-label="질문: upstream 커널이 peer memory 패치를 거부한 이유는 GPU 드라이버별 호환성 때문인가요? 답변: 세 겹의 이유가 겹쳐 있다.">
  <style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}</style>
  <circle cx="30" cy="45.5" r="6.5" fill="#2563eb"/>
  <path d="M20 62.5 C20 53.5, 40 53.5, 40 62.5 Z" fill="#2563eb"/>
  <rect x="75" y="20" width="660" height="76" rx="12" fill="#eff6ff"/>
  <path d="M75 40.0 L62 47.0 L75 54.0 Z" fill="#eff6ff"/>
  <text x="98" y="52.5" font-size="13" font-weight="600" fill="#1f2937">upstream 커널이 이 패치를 받아들이지 않는 이유는</text>
  <text x="98" y="72.5" font-size="13" font-weight="600" fill="#1f2937">GPU 드라이버별 호환성 때문인가요?</text>
  <circle cx="30" cy="130.2" r="2" fill="#16a34a"/>
  <line x1="30" y1="132.2" x2="30" y2="136.2" stroke="#16a34a" stroke-width="1.8"/>
  <path d="M20 136.2 L40 136.2 L40 150.2 L20 150.2 Z" fill="#16a34a"/>
  <circle cx="25" cy="143.2" r="1.9" fill="#dcfce7"/>
  <circle cx="35" cy="143.2" r="1.9" fill="#dcfce7"/>
  <rect x="75" y="122" width="660" height="98" rx="12" fill="#f0fdf4"/>
  <path d="M75 142.0 L62 149.0 L75 156.0 Z" fill="#f0fdf4"/>
  <text x="98" y="148.2" font-size="12" fill="#334155">호환성도 한 축이지만 거부 이유는 세 겹입니다</text>
  <text x="98" y="166.2" font-size="12" fill="#334155">표준 DMA 매핑 층을 우회하는 벤더별 병렬 경로라는 아키텍처 문제</text>
  <text x="98" y="184.2" font-size="12" fill="#334155">유일한 소비자가 out-of-tree 폐쇄 드라이버라는 정책 문제</text>
  <text x="98" y="202.2" font-size="12" fill="#334155">표준 대안 dma-buf가 이미 있다는 결정타(2021년 커널 5.12 머지)</text>
</svg>

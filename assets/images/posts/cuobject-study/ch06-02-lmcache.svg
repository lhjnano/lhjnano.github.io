<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 417" width="700">
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
  </style>

  <!-- canvas: content 25..675, margins 25/25 -->
  <rect x="0" y="0" width="700" height="417" fill="#161b22"/>

  <!-- title: content center x=350 -->
  <text x="350" y="32" font-size="16" fill="#e6edf3" text-anchor="middle">LMCache — KV 캐시 압박 문제와 원격 캐시 해법</text>

  <!-- ── problem panel: x=25..337, y=56..315 ── -->
  <rect x="25" y="56" width="312" height="259" rx="10" fill="none" stroke="#8b949e" stroke-dasharray="6,4"/>
  <text x="37" y="74" font-size="11" fill="#f85149">문제 — KV 캐시가 GPU HBM을 압박</text>

  <rect x="40" y="94" width="282" height="52" rx="6" fill="#263238" stroke="#f85149"/>
  <text x="181" y="116" font-size="12" fill="#e6edf3" text-anchor="middle">vLLM 추론 — KV 캐시 급증</text>
  <text x="181" y="132" font-size="10" fill="#8b949e" text-anchor="middle">긴 컨텍스트일수록 HBM 소모 큼</text>

  <rect x="40" y="171" width="282" height="52" rx="6" fill="#263238" stroke="#f85149"/>
  <text x="181" y="193" font-size="12" fill="#e6edf3" text-anchor="middle">HBM 부족 → 배치 축소</text>
  <text x="181" y="209" font-size="10" fill="#8b949e" text-anchor="middle">처리량·컨텍스트 길이가 제한됨</text>

  <rect x="40" y="248" width="282" height="52" rx="6" fill="#263238" stroke="#f85149"/>
  <text x="181" y="270" font-size="12" fill="#e6edf3" text-anchor="middle">프리필 중복 계산</text>
  <text x="181" y="286" font-size="10" fill="#8b949e" text-anchor="middle">같은 프리픽스를 여러 번 연산</text>

  <!-- ── solution panel: x=363..675, y=56..315 ── -->
  <rect x="363" y="56" width="312" height="259" rx="10" fill="none" stroke="#8b949e" stroke-dasharray="6,4"/>
  <text x="375" y="74" font-size="11" fill="#3fb950">해법 — LMCache 원격 캐시 계층</text>

  <rect x="378" y="94" width="282" height="52" rx="6" fill="#263238" stroke="#3fb950"/>
  <text x="519" y="116" font-size="12" fill="#e6edf3" text-anchor="middle">LMCache — vLLM 플러그인</text>
  <text x="519" y="132" font-size="10" fill="#8b949e" text-anchor="middle">KV 블록 단위 캐싱·재사용</text>

  <rect x="378" y="171" width="282" height="52" rx="6" fill="#263238" stroke="#3fb950"/>
  <text x="519" y="193" font-size="12" fill="#e6edf3" text-anchor="middle">NIXL 경유 전송</text>
  <text x="519" y="209" font-size="10" fill="#8b949e" text-anchor="middle">OBJ accelerated engine → cuObject</text>

  <rect x="378" y="248" width="282" height="52" rx="6" fill="#263238" stroke="#3fb950"/>
  <text x="519" y="270" font-size="12" fill="#e6edf3" text-anchor="middle">KV를 원격 스토리지로</text>
  <text x="519" y="286" font-size="10" fill="#8b949e" text-anchor="middle">HBM 여유 → 더 큰 배치·긴 컨텍스트</text>

  <!-- ── bottom band: x=25..675, y=340..392 ── -->
  <rect x="25" y="340" width="650" height="52" rx="6" fill="#263238" stroke="#58a6ff"/>
  <text x="350" y="362" font-size="12" fill="#e6edf3" text-anchor="middle">LMCache→NIXL→cuObject 경로가 AI 추론 워크로드의 실전 수요처 (§8)</text>
  <text x="350" y="378" font-size="10" fill="#8b949e" text-anchor="middle">프리필 재사용·P/D 분리 같은 시나리오가 원격 스토리지 수요를 부른다</text>
</svg>

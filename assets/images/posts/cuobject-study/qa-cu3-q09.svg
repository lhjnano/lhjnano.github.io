<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 241" width="760" role="img" aria-label="질문: 수만 연결로 대형 생성형 AI 회사가 운용하기 괜찮나요? 답변: 세션과 연결은 자릿수가 다르다.">
  <style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}</style>
  <circle cx="30" cy="45.5" r="6.5" fill="#2563eb"/>
  <path d="M20 62.5 C20 53.5, 40 53.5, 40 62.5 Z" fill="#2563eb"/>
  <rect x="75" y="20" width="660" height="76" rx="12" fill="#eff6ff"/>
  <path d="M75 40.0 L62 47.0 L75 54.0 Z" fill="#eff6ff"/>
  <text x="98" y="52.5" font-size="13" font-weight="600" fill="#1f2937">DC에서 수만 연결 정도 감당이 가능하다는데,</text>
  <text x="98" y="72.5" font-size="13" font-weight="600" fill="#1f2937">수만 연결 가지고 대형 생성형 AI를 다루는 회사들이 운용하기에 괜찮나요?</text>
  <circle cx="30" cy="130.2" r="2" fill="#16a34a"/>
  <line x1="30" y1="132.2" x2="30" y2="136.2" stroke="#16a34a" stroke-width="1.8"/>
  <path d="M20 136.2 L40 136.2 L40 150.2 L20 150.2 Z" fill="#16a34a"/>
  <circle cx="25" cy="143.2" r="1.9" fill="#dcfce7"/>
  <circle cx="35" cy="143.2" r="1.9" fill="#dcfce7"/>
  <rect x="75" y="122" width="660" height="98" rx="12" fill="#f0fdf4"/>
  <path d="M75 142.0 L62 149.0 L75 156.0 Z" fill="#f0fdf4"/>
  <text x="98" y="148.2" font-size="12" fill="#334155">수만 연결은 수만 세션을 직접 받는 뜻이 아니라 그 위에서 멀티플렉싱된다는 뜻입니다</text>
  <text x="98" y="166.2" font-size="12" fill="#334155">사용자 세션은 vLLM 인스턴스가 소유하고 연결은 클라이언트 노드 단위로 집계돼요</text>
  <text x="98" y="184.2" font-size="12" fill="#334155">DCT는 상태를 전송 순간에만 할당하니 유휴 클라이언트가 서버에 상태를 두지 않습니다</text>
  <text x="98" y="202.2" font-size="12" fill="#334155">진짜 상한은 연결 수가 아니라 NIC 대역폭과 게이트웨이 처리량이 먼저예요</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 241" width="760" role="img" aria-label="질문: MOFED는 커널의 IB 매핑을 GPU VRAM 쪽으로 확장한 wrapper인가요? 답변: 방향은 맞지만 주체가 반대다.">
  <style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}</style>
  <circle cx="30" cy="45.5" r="6.5" fill="#2563eb"/>
  <path d="M20 62.5 C20 53.5, 40 53.5, 40 62.5 Z" fill="#2563eb"/>
  <rect x="75" y="20" width="660" height="76" rx="12" fill="#eff6ff"/>
  <path d="M75 40.0 L62 47.0 L75 54.0 Z" fill="#eff6ff"/>
  <text x="98" y="52.5" font-size="13" font-weight="600" fill="#1f2937">MOFED는 커널의 IB 매핑을 GPU VRAM 쪽으로도 하려는</text>
  <text x="98" y="72.5" font-size="13" font-weight="600" fill="#1f2937">wrapper라는 건가요?</text>
  <circle cx="30" cy="130.2" r="2" fill="#16a34a"/>
  <line x1="30" y1="132.2" x2="30" y2="136.2" stroke="#16a34a" stroke-width="1.8"/>
  <path d="M20 136.2 L40 136.2 L40 150.2 L20 150.2 Z" fill="#16a34a"/>
  <circle cx="25" cy="143.2" r="1.9" fill="#dcfce7"/>
  <circle cx="35" cy="143.2" r="1.9" fill="#dcfce7"/>
  <rect x="75" y="122" width="660" height="98" rx="12" fill="#f0fdf4"/>
  <path d="M75 142.0 L62 149.0 L75 156.0 Z" fill="#f0fdf4"/>
  <text x="98" y="148.2" font-size="12" fill="#334155">방향은 맞는데 주체가 반대입니다. MOFED 자체는 GPU를 모릅니다</text>
  <text x="98" y="166.2" font-size="12" fill="#334155">MOFED는 ib_register_peer_memory_client라는 소켓(훅)을 깐 확장 IB 스택이에요</text>
  <text x="98" y="184.2" font-size="12" fill="#334155">그 소켓에 VRAM을 꽂는 플러그(wrapper)는 NVIDIA의 nvidia_peermem입니다</text>
  <text x="98" y="202.2" font-size="12" fill="#334155">실제 번역기는 nvidia.ko이고, upstream 표준 대안은 dma-buf입니다</text>
</svg>

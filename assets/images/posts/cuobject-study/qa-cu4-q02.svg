<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 241" width="760" role="img" aria-label="질문: LLM을 전부 사용하고 종료되면 없어지는 객체들인가요? 답변: HBM 안은 휘발성, 오프로드한 것은 남는 캐시다.">
  <style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}</style>
  <circle cx="30" cy="45.5" r="6.5" fill="#2563eb"/>
  <path d="M20 62.5 C20 53.5, 40 53.5, 40 62.5 Z" fill="#2563eb"/>
  <rect x="75" y="20" width="660" height="76" rx="12" fill="#eff6ff"/>
  <path d="M75 40.0 L62 47.0 L75 54.0 Z" fill="#eff6ff"/>
  <text x="98" y="52.5" font-size="13" font-weight="600" fill="#1f2937">그러면 LLM을 전부 사용하고 종료되면</text>
  <text x="98" y="72.5" font-size="13" font-weight="600" fill="#1f2937">없어지는 객체들인가요?</text>
  <circle cx="30" cy="130.2" r="2" fill="#16a34a"/>
  <line x1="30" y1="132.2" x2="30" y2="136.2" stroke="#16a34a" stroke-width="1.8"/>
  <path d="M20 136.2 L40 136.2 L40 150.2 L20 150.2 Z" fill="#16a34a"/>
  <circle cx="25" cy="143.2" r="1.9" fill="#dcfce7"/>
  <circle cx="35" cy="143.2" r="1.9" fill="#dcfce7"/>
  <rect x="75" y="122" width="660" height="98" rx="12" fill="#f0fdf4"/>
  <path d="M75 142.0 L62 149.0 L75 156.0 Z" fill="#f0fdf4"/>
  <text x="98" y="148.2" font-size="12" fill="#334155">둘로 쪼개서 봐야 합니다. HBM 위의 KV 캐시는 휘발성이라 종료와 함께 사라져요</text>
  <text x="98" y="166.2" font-size="12" fill="#334155">오프로드된 KV 오브젝트는 프로세스와 수명이 분리돼서 지울 때까지 남습니다</text>
  <text x="98" y="184.2" font-size="12" fill="#334155">다만 무한정이 아니라 TTL·LRU eviction으로 재사용 가치가 있을 때만 유지해요</text>
  <text x="98" y="202.2" font-size="12" fill="#334155">남기는 이유는 재계산(GPU 연산)보다 재로딩(대역폭)이 압도적으로 싸기 때문입니다</text>
</svg>

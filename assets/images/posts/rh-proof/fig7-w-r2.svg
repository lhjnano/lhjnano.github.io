<!-- 그림 7. W-R2의 붕괴 경로. 계산은 정확했지만 측정 대상과 주장 대상이 달랐다 -->
<!-- 캡션 문장은 2편 본문에서 그대로 인용된다. -->
<!-- 색: 초록 1단계 통과, 빨강 2단계 붕괴와 라벨 칩과 철회 기록, 회색 교훈 밴드 -->
<!-- 날짜 표기: 철회는 2026-11-25로 쓴다(원문 창 상단 11-27은 오기로 확정). -->
<!-- χ² 11.8~24.5와 기각역 25는 W-R2 재분석 수치를 그대로 쓴 것이다. -->
<!-- 배지: 위 카드에 측정 대상, 아래 카드에 주장 대상의 대비를 강조했다. -->
<!-- 라벨 칩은 두 카드 사이 화살표 위에 놓인 대비 라벨이다. -->
<!-- 노트 박스는 점선 그룹 테두리 안 오른쪽 열에 둔다. -->
<!-- 검증: node tools/svg-lint/bin/svg-lint.mjs assets/images/posts/rh-proof/fig7-w-r2.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 482" width="760" role="img" aria-label="W-R2의 붕괴 경로 도표. 위 초록 카드는 1단계 통과로 키 1,516개가 전부 곡선 방정식을 통과하고 카이제곱 계산이 정확하며 널모델 대조가 정상이었음을 보여주고 측정 대상 배지가 붙어 있다. 가운데 빨간 라벨 칩은 측정 대상과 주장 대상이 같지 않다는 대비를 화살표 위에 보여준다. 아래 빨간 카드는 2단계 붕괴로 중복 제거 미수행, 수집된 키 56개의 실체는 서로 다른 키 3개라는 사실, 인증서가 도메인마다 반복 수집된 점, 중복 제거 뒤 전 발급자 균일로 카이제곱 11.8에서 24.5가 기각역 25에 미달한 점을 보여주고 주장 대상 배지가 붙어 있다. 오른쪽 점선 테두리 안 철회 기록 노트는 철회 2026-11-25과 원문 표기 11-27이 오기임을, 한 줄 대응표가 없어서 통과했다는 문구와 함께 기록한다. 아래 밴드는 계산이 정확해도 측정 대상과 주장 대상이 다르면 검증은 붕괴한다는 교훈을 담는다.">

<!-- 그림 11. 측정 한 번의 정보 회계. 유용한 log₂ r 비트 위에 번짐 A_n 비트가 얹히고 연분수 후처리는 앞만 쓴다 -->
<!-- 캡션 문장은 본문에서 그대로 인용된다. -->
<!-- 왼쪽: 2층 적층 바(아래 초록이 유용 비트, 위 주황이 번짐 비트)와 전체를 묶는 중괄호 H(J). -->
<!-- 오른쪽: 봉우리 내 위치 카드는 위층(버려짐), 연분수 후처리 카드는 아래층(복원에 사용)을 화살표로 가리킨다. -->
<!-- 화살표 규격: 출발점은 카드 왼쪽 벽에서 5px, 끝점은 층 오른쪽 벽에서 11px 짧게 둔다(화살촉 6px 포함 5px 여백). -->
<!-- 레이아웃: 위층 카드는 위층과, 아래층 카드는 아래층과 같은 높이대에 두어 화살표가 수평선이 되게 했다. -->
<!-- 색: 주황 번짐 층과 카드 테두리, 초록 유용 층과 카드, 파랑 결론 박스. -->
<!-- 적층 바는 두 층이 맞닿는 형태라 path로 그렸다(맞닿은 rect는 25px 블록 간격 검사에 걸린다). -->
<!-- 층 높이 근거: r=5일 때 log₂ 5 ≈ 2.32 비트 대 번짐 A_n ≈ 1.22 비트라 아래층을 약 2배로 그렸다. -->
<!-- 중괄호는 꺾임 없는 단일 Q 곡선으로 그렸다(연결선의 60도 이상 코너는 검증에서 에러다). -->
<!-- 검증: node tools/svg-lint/bin/svg-lint.mjs assets/images/posts/rh-proof/fig11-information-accounting.svg -->
<!-- 작성: 2026-11-26, rh-proof 시리즈 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" role="img" aria-label="측정 한 번의 정보 회계 도표. 왼쪽의 세로 적층 바는 아래층 초록의 봉우리 식별, 즉 유용한 log₂ r 비트와 위층 주황의 번짐 A_n 약 1.22 비트로 나눠지고 전체를 중괄호와 측정 엔트로피 H(J) 라벨이 묶는다. 오른쪽 위 카드는 봉우리 내 위치가 위층 번짐에 해당해 버려지는 정보임을 보이고, 오른쪽 아래 카드는 연분수 후처리가 아래층 봉우리 인덱스만 복원에 사용함을 화살표로 연결해 보여준다. 아래 박스는 효율이 log₂ r을 log₂ r 더하기 A_n으로 나눈 값임을 한 줄로 정리한다.">
<style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}</style>

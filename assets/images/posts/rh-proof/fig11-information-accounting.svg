<text x="105" y="310" font-size="12" fill="#2c3e50" text-anchor="middle" font-weight="700">측정 엔트로피 H(J)</text>
<rect x="380" y="84" width="355" height="88" rx="10" fill="#f0f4f8" stroke="#fbbf24" stroke-width="2"/>
<text x="557" y="124" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700">봉우리 내 위치</text>
<text x="557" y="140" font-size="10" fill="#495057" text-anchor="middle">버려지는 정보</text>
<rect x="380" y="202" width="355" height="98" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="557" y="247" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">연분수 후처리</text>
<text x="557" y="263" font-size="10" fill="#495057" text-anchor="middle">봉우리 인덱스만 복원에 사용</text>

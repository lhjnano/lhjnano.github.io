<!-- 그림 9. QFT 측정 분포의 빗과 한 봉우리의 확대. 봉우리가 sinc² 모양으로 이웃 정수로 번진다 -->
<!-- 캡션 문장은 본문에서 그대로 인용된다. -->
<!-- 왼쪽: 세로 막대 빗(r=5 예시, 봉우리 간격 M/r, 축 j). 오른쪽: 한 봉우리 확대(sinc², 정수 격자, 어긋남 δ). -->
<!-- 색: 파랑 막대와 정수 격자 보조선, 보라 곡선과 확대 패널, 초록 δ 표시. -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 394" width="760" role="img" aria-label="QFT 측정 분포 도표. 왼쪽 패널은 세로 막대 여러 개로 그린 측정 분포의 빗이고 r=5 예시에서 봉우리 간격은 M/r이며 가로축은 측정값 j다. 오른쪽 패널은 한 봉우리를 확대해 sinc² 모양의 중앙 봉우리와 좌우 부엽을 그리고 정수 격자를 작은 원으로 표시했다. 봉우리 중심 세로 점선이 가장 가까운 정수에서 소수부 δ만큼 어긋난 모습을 두 패널 사이의 점선 확대 프레임이 연결하고, 아래 박스는 측정 결과 j가 봉우리 중심 근처의 정수에 확률로 떨어진다는 설명을 담는다.">

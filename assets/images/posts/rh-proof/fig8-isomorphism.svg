<!-- 그림 8. 앤트로픽의 검증 파이프라인과 계측 단면도의 대응 지도 -->
<!-- 캡션 문장은 2편 본문에서 그대로 인용된다. 부제: 규모는 달라도 단계 구조가 대응한다 -->
<!-- 색: 왼쪽 열 파랑(앤트로픽과 Lean), 오른쪽 열은 단계 색(빨강 의미론, 파랑 추론, 초록 독립성, 회색 회계) -->
<!-- ⑥⑦은 계측 단면도 v0.2 검사 항목 번호를 따른다. -->
<!-- 좌우 카드 폭은 340px로 같게 하여 행 크기 불일치 판정을 피한다. -->
<!-- 검증: node tools/svg-lint/bin/svg-lint.mjs assets/images/posts/rh-proof/fig8-isomorphism.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" width="760" role="img" aria-label="앤트로픽의 검증 파이프라인과 계측 단면도의 대응 지도 도표. 왼쪽 열은 앤트로픽과 Lean 파이프라인의 네 단계로 명제 정의는 Mathlib 재사용, 명제 일치는 고립 파일과 comparator, 증명 유효성은 커널과 독립 체커, toy 세팅 수송과 생존 회계는 장난감 세팅의 아이디어를 전체로 수송한다. 오른쪽 열은 계측 단면도 검증 단계의 네 카드로 의미론 단계의 명제-대응 검사 6번, 추론 단계의 독립 재현 채널 7번, 제2 채널이 1·2단계를 재현하는 독립성 단계, 축소 모델 H4와 생존율 회계다. 네 개의 가로 화살표가 좌우 카드를 한 행씩 대응 연결하며, 규모는 달라도 단계 구조가 대응한다는 부제를 머리에 둔다.">

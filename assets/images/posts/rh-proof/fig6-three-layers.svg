<text x="380" y="32" font-size="14" fill="#2c3e50" text-anchor="middle" font-weight="700">검증 3단계 모델: 세 개의 고리가 따로 닫힌다</text>
<text x="380" y="60" font-size="11" fill="#666666" text-anchor="middle">증거에서 주장까지, 의미론이 항상 최약 고리다</text>
<rect x="25" y="84" width="710" height="98" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>

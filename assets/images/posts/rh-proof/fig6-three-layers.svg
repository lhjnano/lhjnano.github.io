<rect x="25" y="210" width="710" height="98" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="40" y="263.2" font-size="12" fill="#dc2626" font-weight="700">2단계</text>
<text x="100" y="263.2" font-size="12" fill="#2c3e50" font-weight="700">의미론</text>
<text x="380" y="240" font-size="10" fill="#495057" text-anchor="middle">내부 결론이 주장하는 바와 같은가?</text>
<text x="715" y="240" font-size="10" fill="#dc2626" text-anchor="end" font-weight="700">최약 고리</text>
<text x="380" y="255" font-size="10" fill="#495057" text-anchor="middle">닫는 주체: 사람 · 대응 감사</text>
<text x="380" y="270" font-size="10" fill="#495057" text-anchor="middle">도구: 고립 명제 파일 · comparator</text>
<text x="380" y="285" font-size="10" fill="#495057" text-anchor="middle">실패 시: 대상 불일치</text>
<path d="M380,313 L380,325" stroke="#666666" stroke-width="1.5" fill="none" marker-end="url(#ah-gray-6)"/>
<rect x="25" y="336" width="710" height="98" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="40" y="389.2" font-size="12" fill="#16a34a" font-weight="700">3단계</text>
<text x="100" y="389.2" font-size="12" fill="#2c3e50" font-weight="700">독립성</text>
<text x="380" y="366" font-size="10" fill="#495057" text-anchor="middle">제2 채널이 1·2단계를 재현하는가?</text>
<text x="380" y="381" font-size="10" fill="#495057" text-anchor="middle">닫는 주체: 별도 구현 · 독립 검증자</text>
<text x="380" y="396" font-size="10" fill="#495057" text-anchor="middle">도구: 다수 재현 · 검증 대시보드</text>
<text x="380" y="411" font-size="10" fill="#495057" text-anchor="middle">실패 시: 우연 정합</text>
<rect x="25" y="462" width="710" height="46" rx="10" fill="#f0f4f8" stroke="#999999" stroke-width="2"/>
<text x="380" y="488.5" font-size="10" fill="#2c3e50" text-anchor="middle">세 고리는 각각 따로 닫히고, 가장 약한 고리가 전체의 강도가 된다</text>
</svg>

<!-- 그림 6. 검증 3단계 모델. 증거에서 주장까지 세 개의 고리가 따로 닫히고 의미론이 항상 최약 고리다 -->
<!-- 캡션 문장은 2편 본문에서 그대로 인용된다. -->

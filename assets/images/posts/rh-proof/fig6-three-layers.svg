<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" role="img" aria-label="검증 3단계 모델 도표. 추론 단계는 증거가 내부 결론을 함의하는가를 기계와 코드, 커널이 닫고 실패 시 계산 오류가 나며, 도구로 커널 리플레이와 독립 체커, 컴파일이 쓰인다. 의미론 단계는 내부 결론이 주장하는 바와 같은가를 사람과 대응 감사가 닫고 실패 시 대상 불일치가 생기며, 도구로 고립 명제 파일과 comparator가 쓰이고 빨간색으로 최약 고리임을 표시했다. 독립성 단계는 제2 채널이 1·2단계를 재현하는가를 별도 구현과 독립 검증자가 닫고 실패 시 우연 정합이 남으며, 도구로 다수 재현과 검증 대시보드가 쓰인다. 단계 사이의 화살표는 내부 결론이 의미론 검사로 넘어가고 다시 독립성 검사로 이어지는 흐름을 보여주고, 아래 밴드는 가장 약한 고리가 전체의 강도가 된다는 원칙을 담는다.">
<style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}</style>
<rect x="0" y="0" width="760" height="530" fill="#ffffff"/>
<defs>
<marker id="ah-gray-6" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#666666"/></marker>

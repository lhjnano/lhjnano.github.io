<text x="100" y="137.2" font-size="12" fill="#2c3e50" font-weight="700">추론</text>
<text x="380" y="114" font-size="10" fill="#495057" text-anchor="middle">증거가 내부 결론을 함의하는가?</text>
<text x="380" y="129" font-size="10" fill="#495057" text-anchor="middle">닫는 주체: 기계 · 코드 · 커널</text>

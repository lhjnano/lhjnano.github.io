<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 546" width="760" role="img" aria-label="리만 가설 증명 주장의 세로 타임라인. 1859년 리만 가설 제창으로 167년의 미해결이 시작되고, 1949년 Weil이 유한체 곡선의 RH를 증명하고, 1969년 Stepanov가 같은 정리의 초등적 증명을 낸다. 2026년 8월 10일 Claude가 영점 하한을 41.6%에서 67.2%로 올리고, 11월 20일 Alpöge가 RH와 GRH 증명을 주장하며 Lean 라이브러리 14파트를 공개하고, 11월 21일 Lean 커뮤니티가 네 가지 기준 통과로 인증을 성명한다. 이후 저널 게재와 2년 공개 검증을 거쳐 Clay 상금 심의가 남은 절차로 점선으로 표시되어 있다.">
<style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}</style>
<rect x="0" y="0" width="760" height="546" fill="#ffffff"/>
<text x="380" y="32" font-size="14" fill="#2c3e50" text-anchor="middle" font-weight="700">167년 미해결 끝에 2026년 인증에 이른 리만 가설 증명 주장</text>
<line x1="30" y1="82" x2="30" y2="432" stroke="#cbd5e1" stroke-width="2"/>
<line x1="30" y1="432" x2="30" y2="502" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>
<circle cx="30" cy="82" r="5" fill="#2563eb"/>
<circle cx="30" cy="152" r="5" fill="#7c3aed"/>
<circle cx="30" cy="222" r="5" fill="#7c3aed"/>
<circle cx="30" cy="292" r="5" fill="#16a34a"/>
<circle cx="30" cy="362" r="5" fill="#16a34a"/>
<circle cx="30" cy="432" r="5" fill="#16a34a"/>
<circle cx="30" cy="502" r="5" fill="#ffffff" stroke="#999999" stroke-width="2"/>
<rect x="60" y="60" width="675" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="76" y="86" font-size="12" fill="#2563eb" font-weight="700">1859</text>
<text x="176" y="86" font-size="11" fill="#495057">리만 가설 제창(167년 미해결의 시작)</text>
<rect x="60" y="130" width="675" height="44" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="76" y="156" font-size="12" fill="#7c3aed" font-weight="700">1949</text>
<text x="176" y="156" font-size="11" fill="#495057">Weil: 유한체 곡선의 RH 증명</text>
<rect x="60" y="200" width="675" height="44" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="76" y="226" font-size="12" fill="#7c3aed" font-weight="700">1969</text>
<text x="176" y="226" font-size="11" fill="#495057">Stepanov: 같은 정리의 초등적 증명</text>
<rect x="60" y="270" width="675" height="44" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="76" y="296" font-size="12" fill="#16a34a" font-weight="700">2026-08-10</text>
<text x="176" y="296" font-size="11" fill="#495057">Claude가 영점 하한 41.6%에서 67.2%로(Anthropic 공개)</text>
<rect x="60" y="340" width="675" height="44" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="76" y="366" font-size="12" fill="#16a34a" font-weight="700">2026-11-20</text>
<text x="176" y="366" font-size="11" fill="#495057">Alpöge가 RH·GRH 증명 주장, Lean 라이브러리 14파트 공개</text>
<rect x="60" y="410" width="675" height="44" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="76" y="436" font-size="12" fill="#16a34a" font-weight="700">2026-11-21</text>
<text x="176" y="436" font-size="11" fill="#495057">Lean 커뮤니티가 4기준 통과로 인증 성명</text>
<rect x="60" y="480" width="675" height="44" rx="10" fill="#f0f4f8" stroke="#999999" stroke-width="2" stroke-dasharray="6,4"/>
<text x="76" y="506" font-size="12" fill="#666666" font-weight="700">이후</text>
<text x="176" y="506" font-size="11" fill="#666666">저널 게재와 2년 공개 검증 뒤 Clay 상금 심의(아직 남은 절차)</text>
</svg>

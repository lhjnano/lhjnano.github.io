<svg viewBox="0 0 860 430" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI 학습 하루의 I/O 시간축">
  <style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;}</style>
  <rect x="0" y="0" width="860" height="430" fill="#ffffff"/>
  <text x="440" y="28" font-size="15" fill="#ffffff" text-anchor="middle">AI 학습의 하루 — 저장 I/O 속도 (GB/s · 로그 눈금)</text>
  <!-- y축 로그: 0.1,1,10,100 → y=350,270,190,90 (80px/decade) ; x: t=0..20h → 100..800 -->
  <path d="M100,90 L100,350 L800,350" stroke="#999999" fill="none"/>
  <text x="92" y="354" font-size="10" fill="#78909c" text-anchor="end">0.1</text>
  <text x="92" y="274" font-size="10" fill="#78909c" text-anchor="end">1</text>
  <text x="92" y="194" font-size="10" fill="#78909c" text-anchor="end">10</text>
  <text x="92" y="94" font-size="10" fill="#78909c" text-anchor="end">100</text>
  <text x="86" y="240" font-size="10" fill="#78909c" text-anchor="end" transform="rotate(-90 86 240)">GB/s</text>
  <!-- 시간 눈금: 3h 간격 x=100,205,310,415,520,625,730 -->
  <text x="100" y="368" font-size="10" fill="#78909c" text-anchor="middle">0h</text>
  <text x="205" y="368" font-size="10" fill="#78909c" text-anchor="middle">3h</text>
  <text x="310" y="368" font-size="10" fill="#78909c" text-anchor="middle">6h</text>
  <text x="415" y="368" font-size="10" fill="#78909c" text-anchor="middle">9h</text>
  <text x="520" y="368" font-size="10" fill="#78909c" text-anchor="middle">12h</text>
  <text x="625" y="368" font-size="10" fill="#78909c" text-anchor="middle">15h</text>
  <text x="730" y="368" font-size="10" fill="#78909c" text-anchor="middle">18h</text>
  <text x="800" y="368" font-size="10" fill="#78909c" text-anchor="middle">20h</text>
  <!-- ① 수집적재: 0~1h, 1GB/s (y=270) -->
  <rect x="100" y="270" width="35" height="80" fill="#a7f3d0"/>
  <text x="118" y="262" font-size="10" fill="#495057" text-anchor="middle">① 적재</text>
  <!-- ② 전처리: 1~3h — 읽기 10GB/s(y190) + 종료 쓰기 버스트 20GB/s(y~150) -->
  <rect x="135" y="190" width="60" height="160" fill="#bfdbfe"/>
  <polygon points="195,350 195,150 218,150 218,350" fill="#86efac"/>
  <text x="165" y="182" font-size="10" fill="#495057" text-anchor="middle">② 전처리 읽기</text>
  <text x="207" y="140" font-size="10" fill="#495057" text-anchor="middle">출력 ×2 버스트</text>
  <!-- ③ 섭취: 3h~ — 콜드 19.2GB/s(y~152) 3~6h, 웜 1.9GB/s(y~249) 이후 -->
  <rect x="218" y="152" width="92" height="198" fill="#93c5fd"/>
  <rect x="310" y="249" width="490" height="101" fill="#bfdbfe"/>
  <path d="M310,249 L310,152" stroke="#1976d2" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="264" y="144" font-size="10" fill="#495057" text-anchor="middle">③ 섭취(콜드)</text>
  <text x="555" y="241" font-size="10" fill="#495057" text-anchor="middle">섭취(웜) — 캐시 히트 후 저장 부하 1/10</text>
  <!-- ④ 체크포인트 스파이크: 6,9,12,15,18h x=310,415,520,625,730 → 63GB/s(y~111) -->
  <polygon points="304,350 310,111 316,350" fill="#fbbf24"/>
  <polygon points="409,350 415,111 421,350" fill="#fbbf24"/>
  <polygon points="514,350 520,111 526,350" fill="#fbbf24"/>
  <polygon points="619,350 625,111 631,350" fill="#fbbf24"/>
  <polygon points="724,350 730,111 736,350" fill="#fbbf24"/>
  <text x="520" y="100" font-size="10.5" fill="#92400e" text-anchor="middle">④ 체크포인트 — 3.6분 스파이크가 수십 분 간격 (관측)</text>
  <!-- 주석 박스 -->
  <rect x="100" y="392" width="700" height="30" rx="6" fill="#f3f7fb" stroke="#e4e9ee"/>
  <text x="450" y="411" font-size="11" fill="#ffffff" text-anchor="middle">저장이 "바쁜" 순간은 세 곳: ② 콜드 읽기+출력 버스트 · ③ 캐시 밖 잔량 · ④ 체크포인트 스파이크</text>
</svg>
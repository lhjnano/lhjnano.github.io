<svg viewBox="0 0 800 360" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="체크포인트 한 건의 확대">
  <style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;}</style>
  <rect x="0" y="0" width="800" height="300" fill="#ffffff"/>
  <text x="400" y="26" font-size="15" fill="#ffffff" text-anchor="middle">체크포인트 한 건 — 쓰기 속도의 시간 전개 (확대)</text>
  <!-- y: 0..200GB/s → y=240..60 ; x: 0..5min → 100..700 -->
  <rect x="100" y="60" width="600" height="135" fill="#fef3c7" opacity="0.6"/>
  <text x="695" y="54" font-size="10" fill="#92400e" text-anchor="end">관측 drain 밴드 50–200 GB/s</text>
  <path d="M100,240 L136,240 C160,240 160,183 190,183 L540,183 C570,183 570,240 604,240" stroke="#fbbf24" stroke-width="3" fill="none"/>
  <path d="M100,240 L700,240" stroke="#999999"/>
  <text x="92" y="244" font-size="10" fill="#78909c" text-anchor="end">0</text>
  <text x="92" y="186" font-size="10" fill="#78909c" text-anchor="end">63</text>
  <text x="86" y="180" font-size="10" fill="#78909c" text-anchor="end" transform="rotate(-90 86 180)">GB/s</text>
  <text x="352" y="262" font-size="10" fill="#78909c" text-anchor="middle">지속 3.6분 (800B 모델 관측 중앙값)</text>
  <text x="352" y="278" font-size="10" fill="#78909c" text-anchor="middle">간격 40분 → 오버랩 9%</text>
  <rect x="470" y="292" width="310" height="44" rx="8" fill="#f3f7fb" stroke="#e4e9ee"/>
  <text x="625" y="310" font-size="10.5" fill="#ffffff" text-anchor="middle">비동기 drain — 쓰는 동안 학습 계속</text>
  <text x="625" y="328" font-size="10" fill="#495057" text-anchor="middle">전역 저장은 노드 로컬 체크포인트의 주기적 drain만 흡수</text>
</svg>
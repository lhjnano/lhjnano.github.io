<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" role="img">
<style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}</style>
<rect x="0" y="0" width="760" height="540" fill="#ffffff"/>
<defs>
<marker id="flowUp" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 8 L4 0 L8 8 Z" fill="#2563eb"/></marker>
<marker id="flowDown" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L4 8 L8 0 Z" fill="#16a34a"/></marker>
<marker id="ckpt" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L4 8 L8 0 Z" fill="#7c3aed"/></marker>
</defs>
<text x="380" y="34" font-size="14" font-weight="700" fill="#2c3e50" text-anchor="middle">시간축 × 계층 — 선의 굵기와 화살표가 데이터 흐름을 나타낸다</text>
<line x1="140" y1="124" x2="720" y2="124" stroke="#e2e8f0" stroke-width="1"/>
<text x="130" y="96.0" font-size="12" font-weight="700" fill="#dc2626" text-anchor="end">GPU · HBM</text>
<text x="130" y="112.0" font-size="9" fill="#999999" text-anchor="end">3~8 TB/s</text>
<line x1="140" y1="216" x2="720" y2="216" stroke="#e2e8f0" stroke-width="1"/>
<text x="130" y="188.0" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="end">CPU · RAM</text>
<text x="130" y="204.0" font-size="9" fill="#999999" text-anchor="end">100~400 GB/s</text>
<line x1="140" y1="308" x2="720" y2="308" stroke="#e2e8f0" stroke-width="1"/>
<text x="130" y="280.0" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end">로컬 NVMe</text>
<text x="130" y="296.0" font-size="9" fill="#999999" text-anchor="end">28~56 GB/s</text>
<line x1="140" y1="400" x2="720" y2="400" stroke="#e2e8f0" stroke-width="1"/>
<text x="130" y="372.0" font-size="12" font-weight="700" fill="#2563eb" text-anchor="end">전역 저장</text>
<text x="130" y="388.0" font-size="9" fill="#999999" text-anchor="end">50~200 GB/s</text>
<line x1="140" y1="438" x2="720" y2="438" stroke="#999999" stroke-width="1.5" marker-end="url(#flowUp)"/>
<line x1="150" y1="433" x2="150" y2="443" stroke="#999999" stroke-width="1.5"/>
<text x="150" y="458" font-size="9" fill="#999999" text-anchor="middle">0h</text>
<line x1="230" y1="433" x2="230" y2="443" stroke="#999999" stroke-width="1.5"/>
<text x="230" y="458" font-size="9" fill="#999999" text-anchor="middle">3h</text>
<line x1="310" y1="433" x2="310" y2="443" stroke="#999999" stroke-width="1.5"/>
<text x="310" y="458" font-size="9" fill="#999999" text-anchor="middle">6h</text>
<line x1="390" y1="433" x2="390" y2="443" stroke="#999999" stroke-width="1.5"/>
<text x="390" y="458" font-size="9" fill="#999999" text-anchor="middle">9h</text>
<line x1="470" y1="433" x2="470" y2="443" stroke="#999999" stroke-width="1.5"/>
<text x="470" y="458" font-size="9" fill="#999999" text-anchor="middle">12h</text>
<line x1="550" y1="433" x2="550" y2="443" stroke="#999999" stroke-width="1.5"/>
<text x="550" y="458" font-size="9" fill="#999999" text-anchor="middle">15h</text>
<line x1="630" y1="433" x2="630" y2="443" stroke="#999999" stroke-width="1.5"/>
<text x="630" y="458" font-size="9" fill="#999999" text-anchor="middle">18h</text>
<line x1="710" y1="433" x2="710" y2="443" stroke="#999999" stroke-width="1.5"/>
<text x="710" y="458" font-size="9" fill="#999999" text-anchor="middle">21h</text>
<line x1="150" y1="368.0" x2="190" y2="368.0" stroke="#2563eb" stroke-width="4"/>
<text x="162" y="368.0" font-size="9" fill="#2563eb" font-weight="700">① 적재 1TB</text>
<line x1="210" y1="368.0" x2="210" y2="92.0" stroke="#2563eb" stroke-width="5" marker-end="url(#flowUp)"/>
<text x="222" y="230.0" font-size="9" fill="#2563eb" font-weight="700">② 콜드 읽기</text>
<line x1="260" y1="92.0" x2="260" y2="368.0" stroke="#16a34a" stroke-width="8" marker-end="url(#flowDown)"/>
<line x1="310" y1="368.0" x2="310" y2="92.0" stroke="#2563eb" stroke-width="5" marker-end="url(#flowUp)"/>
<text x="322" y="230.0" font-size="9" fill="#2563eb" font-weight="700">③ 콜드 섭취</text>
<line x1="400" y1="184.0" x2="400" y2="92.0" stroke="#2563eb" stroke-width="14" marker-end="url(#flowUp)"/>
<text x="412" y="132.0" font-size="9" fill="#2563eb" font-weight="700">③ 웜 섭취 6TB</text>
<text x="412" y="144.0" font-size="9" fill="#2563eb" font-weight="700">(캐시 히트 · 저장 미접촉)</text>
<line x1="530" y1="92.0" x2="530" y2="276.0" stroke="#7c3aed" stroke-width="6" marker-end="url(#ckpt)"/>
<text x="542" y="178.0" font-size="9" fill="#7c3aed" font-weight="700">④ 체크포인트</text>
<text x="542" y="190.0" font-size="9" fill="#7c3aed" font-weight="700">1TB/회 ×5</text>
<line x1="570" y1="276.0" x2="570" y2="368.0" stroke="#f59e0b" stroke-width="4" marker-end="url(#flowDown)"/>
<line x1="280" y1="184.0" x2="280" y2="276.0" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#flowDown)"/>
<text x="292" y="230.0" font-size="9" fill="#7c3aed" font-weight="700">스필</text>
<text x="272" y="230.0" font-size="9" fill="#16a34a" font-weight="700" transform="rotate(90 272 230.0)">출력 2TB 버스트</text>
<text x="582" y="322.0" font-size="8" fill="#92400e">drain</text>
<rect x="22" y="470" width="716" height="50" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="380" y="490" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">저장이 실제로 나르는 총량: 1 + 1 + 2 + 5 = 9TB</text>
<text x="380" y="510" font-size="10" fill="#495057" text-anchor="middle">웜 섭취 6TB가 가장 두껍지만 저장을 지나지 않는다 · 설계는 9TB의 속도와 시점에 맞춘다</text>
</svg>

<svg viewBox="0 0 860 540" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="시간축 x 하드웨어 계층 통합 그림 - 선 폭은 데이터량">
  <style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;}</style>
  <defs>
    <marker id="tA6" markerWidth="14" markerHeight="14" refX="3.5" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 L3.5,7 z" fill="#1976d2"/></marker>
    <marker id="tA20" markerWidth="26" markerHeight="26" refX="6.5" refY="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L26,13 L0,26 L6.5,13 z" fill="#1976d2"/></marker>
    <marker id="tB9" markerWidth="16" markerHeight="16" refX="4" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16 L4,8 z" fill="#16a34a"/></marker>
    <marker id="tC6" markerWidth="14" markerHeight="14" refX="3.5" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 L3.5,7 z" fill="#fbbf24"/></marker>
    <marker id="tD2" markerWidth="12" markerHeight="12" refX="3" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 L3,6 z" fill="#999999"/></marker>
  </defs>
  <rect x="0" y="0" width="860" height="540" fill="#ffffff"/>
  <text x="440" y="28" font-size="15" fill="#ffffff" text-anchor="middle">시간축 × 하드웨어 계층 — 선의 굵기 = 이동 데이터량</text>
  <rect x="150" y="71"  width="650" height="48" fill="#e3f2fd"/>
  <rect x="150" y="161" width="650" height="48" fill="#f1f5f9"/>
  <rect x="150" y="251" width="650" height="48" fill="#2c3e50"/>
  <rect x="150" y="341" width="650" height="48" fill="#f8fafc"/>
  <path d="M150,71 L150,389" stroke="#999999"/>
  <path d="M150,413 L800,413" stroke="#999999"/>
  <text x="142" y="90"  font-size="12" fill="#ffffff" text-anchor="end" font-weight="bold">GPU · HBM</text>
  <text x="142" y="108" font-size="9.5"  fill="#78909c" text-anchor="end">3–8 TB/s</text>
  <text x="142" y="180" font-size="12" fill="#ffffff" text-anchor="end" font-weight="bold">CPU · RAM</text>
  <text x="142" y="198" font-size="9.5"  fill="#78909c" text-anchor="end">100–400 GB/s</text>
  <text x="142" y="270" font-size="12" fill="#ffffff" text-anchor="end" font-weight="bold">로컬 NVMe</text>
  <text x="142" y="288" font-size="9.5"  fill="#78909c" text-anchor="end">28–56 GB/s</text>
  <text x="142" y="360" font-size="12" fill="#ffffff" text-anchor="end" font-weight="bold">전역 저장</text>
  <text x="142" y="378" font-size="9.5"  fill="#78909c" text-anchor="end">50–200 GB/s</text>
  <text x="150" y="428" font-size="10" fill="#78909c" text-anchor="middle">0h</text>
  <text x="243" y="428" font-size="10" fill="#78909c" text-anchor="middle">3h</text>
  <text x="336" y="428" font-size="10" fill="#78909c" text-anchor="middle">6h</text>
  <text x="428" y="428" font-size="10" fill="#78909c" text-anchor="middle">9h</text>
  <text x="521" y="428" font-size="10" fill="#78909c" text-anchor="middle">12h</text>
  <text x="614" y="428" font-size="10" fill="#78909c" text-anchor="middle">15h</text>
  <text x="707" y="428" font-size="10" fill="#78909c" text-anchor="middle">18h</text>
  <text x="800" y="428" font-size="10" fill="#78909c" text-anchor="middle">21h</text>
  <!-- ① 적재 1TB → 폭 6 -->
  <rect x="150" y="362" width="31" height="6" fill="#16a34a"/>
  <text x="166" y="404" font-size="9.5" fill="#16a34a" text-anchor="middle">① 적재 1TB</text>
  <!-- ② 콜드 읽기 1TB 폭6 / 출력 2TB 폭9 / 스플 가늘게 -->
  <path d="M185,353 L185,197" stroke="#1976d2" stroke-width="6" fill="none" marker-end="url(#tA6)"/>
  <text x="143" y="230" font-size="9.5" fill="#1976d2" text-anchor="end">② 콜드 읽기 1TB</text>
  <text x="143" y="244" font-size="9.5" fill="#1976d2" text-anchor="end">+85s/617MB 실측</text>
  <path d="M225,193 L225,349" stroke="#16a34a" stroke-width="9" fill="none" marker-end="url(#tB9)"/>
  <text x="143" y="272" font-size="9.5" fill="#16a34a" text-anchor="end">출력 버스트 2TB</text>
  <text x="143" y="286" font-size="9.5" fill="#16a34a" text-anchor="end">처리와 병렬·0.4%</text>
  <path d="M205,193 L205,243" stroke="#999999" stroke-width="2" stroke-dasharray="4,3" fill="none" marker-end="url(#tD2)"/>
  <text x="143" y="316" font-size="9" fill="#78909c" text-anchor="end">스필(조건부 왕복)</text>
  <!-- ③ 섭취 콜드 1TB 폭6 / 웜 6TB 폭20 -->
  <path d="M300,353 L300,107" stroke="#1976d2" stroke-width="6" fill="none" marker-end="url(#tA6)"/>
  <text x="310" y="374" font-size="9.5" fill="#1976d2">③ 콜드 섭취 1TB — 에포크 1(전역 구간 포함)</text>
  <path d="M385,193 L385,107" stroke="#1976d2" stroke-width="20" fill="none" marker-end="url(#tA20)"/>
  <text x="440" y="88" font-size="10.5" fill="#eff6ff" font-weight="bold">섭취 웜 6TB(에포크 2~7) — 가장 굵은 파이프, 그러나 전역에 닿지 않는다</text>
  <!-- ④ 체크포인트 각 1TB 폭6 + drain -->
  <g stroke="#fbbf24" fill="none">
    <path d="M336,107 L336,247" stroke-width="6"/><path d="M344,283 L344,349" stroke-width="6" marker-end="url(#tC6)"/>
    <path d="M428,107 L428,247" stroke-width="6"/><path d="M436,283 L436,349" stroke-width="6" marker-end="url(#tC6)"/>
    <path d="M521,107 L521,247" stroke-width="6"/><path d="M529,283 L529,349" stroke-width="6" marker-end="url(#tC6)"/>
    <path d="M614,107 L614,247" stroke-width="6"/><path d="M622,283 L622,349" stroke-width="6" marker-end="url(#tC6)"/>
    <path d="M707,107 L707,247" stroke-width="6"/><path d="M715,283 L715,349" stroke-width="6" marker-end="url(#tC6)"/>
  </g>
  <text x="521" y="62" font-size="10.5" fill="#92400e" text-anchor="middle">④ 체크포인트 1TB/회 ×5 — HBM→NVMe 즉시 + 전역 drain(3단 하강) · 간격 수십 분</text>
  <!-- 요약 -->
  <rect x="150" y="447" width="650" height="68" rx="8" fill="#f3f7fb" stroke="#e4e9ee"/>
  <text x="475" y="468" font-size="11" fill="#ffffff" text-anchor="middle">예시 규모: 데이터셋 1TB · 에포크 7회 · 체크포인트 1TB/회(70B 모델급) — 폭은 총 이동량에 비례</text>
  <text x="475" y="488" font-size="10.5" fill="#495057" text-anchor="middle">총량으로 보면 재읽기 6TB가 가장 굵은데 저장을 안 지난다 — 저장이 실제로 나르는 건</text>
  <text x="475" y="506" font-size="10.5" fill="#495057" text-anchor="middle">적재 1 + 콜드 1 + 출력 2 + drain 5 = 9TB. 저장 설계는 이 9TB의 속도·시점에 맞춘다</text>
</svg>
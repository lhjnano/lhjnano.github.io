<text x="380" y="32" font-size="14" font-weight="700" fill="#2c3e50" text-anchor="middle">계층 사다리와 데이터 흐름</text>
<rect x="200" y="52" width="360" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="220" y="80" font-size="13" font-weight="700" fill="#dc2626">GPU · HBM</text>
<text x="220" y="102" font-size="10" fill="#495057">모델 · 활성화 · KV 캐시 · 3~8 TB/s</text>
<rect x="200" y="149" width="360" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="220" y="177" font-size="13" font-weight="700" fill="#7c3aed">CPU · RAM</text>
<text x="220" y="199" font-size="10" fill="#495057">페이지 캐시 · 스테이징 · 100~400 GB/s</text>
<rect x="200" y="246" width="360" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="220" y="274" font-size="13" font-weight="700" fill="#16a34a">로컬 NVMe</text>
<text x="220" y="296" font-size="10" fill="#495057">체크포인트 1단계 · 스플 · 28~56 GB/s</text>
<rect x="200" y="343" width="360" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="220" y="371" font-size="13" font-weight="700" fill="#2563eb">전역 저장</text>
<text x="220" y="393" font-size="10" fill="#495057">원본 · drain · 아카이브 · 50~200 GB/s</text>
<line x1="170" y1="343" x2="170" y2="122" stroke="#2563eb" stroke-width="4" marker-end="url(#m16)"/>
<text x="152" y="232" font-size="10" font-weight="700" fill="#2563eb" text-anchor="end">섭취</text>
<text x="152" y="246" font-size="9" fill="#2563eb" text-anchor="end">등반</text>
<line x1="155" y1="149" x2="155" y2="122" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#m8)"/>
<text x="140" y="136" font-size="8" fill="#2563eb" text-anchor="end">캐시</text>
<line x1="100" y1="149" x2="100" y2="316" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#m8)"/>
<line x1="100" y1="316" x2="100" y2="149" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#m8)"/>
<text x="85" y="232" font-size="9" font-weight="700" fill="#7c3aed" text-anchor="end">스필</text>
<text x="85" y="244" font-size="8" fill="#7c3aed" text-anchor="end">왕복</text>
<line x1="580" y1="122" x2="580" y2="149" stroke="#fbbf24" stroke-width="3" marker-end="url(#m12o)"/>
<text x="596" y="136" font-size="8" fill="#92400e">스테이징</text>
<line x1="580" y1="219" x2="580" y2="246" stroke="#fbbf24" stroke-width="3" marker-end="url(#m12o)"/>
<text x="596" y="232" font-size="8" fill="#92400e">로컬 쓰기</text>
<line x1="580" y1="316" x2="580" y2="343" stroke="#fbbf24" stroke-width="2" marker-end="url(#m8o)"/>
<text x="596" y="330" font-size="8" fill="#92400e">drain</text>
<text x="660" y="232" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle" transform="rotate(90 660 232)">체크포인트 하강</text>
<rect x="25" y="410" width="710" height="40" rx="10" fill="#f0f4f8" stroke="#666666" stroke-width="1.5"/>
<text x="380" y="432" font-size="11" fill="#495057" text-anchor="middle">섭취는 위로 등반 · 체크포인트는 아래로 하강 · 스플은 왕복 · 셔플은 저장이 아닌 네트워크</text>
</svg>
